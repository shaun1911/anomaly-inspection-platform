# One-command deployment for the GPU serving box.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   curl http://localhost:8000/health
#
# Swap `Dockerfile.gpu` for `Dockerfile.onnx` on CPU-only line PCs.
services:
  aip:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gpu
    image: aip-serving:gpu
    container_name: aip-serving
    ports:
      - "8000:8000"
    volumes:
      # swap models without rebuilding the image:
      #   cp -r artifacts/new-line artifacts/current && curl -X POST localhost:8000/reload
      - ../artifacts:/app/artifacts:ro
    environment:
      AIP_BUNDLE: /app/artifacts/demo-metal
      AIP_BACKEND: torch
      AIP_MAX_BATCH: "8"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
