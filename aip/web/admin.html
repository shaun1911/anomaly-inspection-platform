<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIP 服务端</title>
<style>
  :root{
    color-scheme: light dark;
    --brand:#F26522;
    --ok:light-dark(#1B8F3A,#34C759);
    --warn:light-dark(#A86500,#F5A623);
    --bad:light-dark(#C62828,#FF453A);
    --g0:light-dark(#F4F5F7,#0F1115);
    --g1:light-dark(#FFFFFF,#1A1D23);
    --g2:light-dark(#EEF0F4,#2A2F37);
    --g3:light-dark(#D6DAE1,#3A404A);
    --t1:light-dark(#16181D,#F5F6F8);
    --t2:light-dark(#4B5563,#A8AFBA);
    --t3:light-dark(#6B7280,#8A929E);
    --ring:light-dark(rgba(242,101,34,.35),rgba(242,101,34,.55));
    accent-color: var(--brand);
    scrollbar-color: light-dark(#B9BFC8,#4A515C) transparent;
  }
  *{box-sizing:border-box}
  html,body{background:var(--g0)}
  body{margin:0;color:var(--t1);font:14px/1.55 "Microsoft YaHei",system-ui,sans-serif}
  :focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}

  .shell{display:grid;grid-template-columns:196px 1fr;min-height:100vh}
  aside{background:var(--g1);border-right:1px solid var(--g3);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
  .logo{display:flex;align-items:center;gap:8px;padding:6px 10px 14px;font-weight:600}
  .logo i{width:10px;height:10px;border-radius:3px;background:var(--brand);display:inline-block}
  nav a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;color:var(--t2);text-decoration:none;font-size:13px;margin-bottom:2px}
  nav a:hover{background:var(--g2);color:var(--t1)}
  nav a[aria-current="page"]{background:var(--g2);color:var(--t1);font-weight:600}
  nav .group{margin:14px 10px 6px;font-size:11px;color:var(--t3);letter-spacing:.04em}
  .side-foot{margin-top:18px;padding:10px;border-top:1px solid var(--g3);font-size:11px;color:var(--t3)}

  header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--g1);border-bottom:1px solid var(--g3);position:sticky;top:0;z-index:4}
  header h1{font-size:15px;margin:0;font-weight:600}
  .search{flex:1;max-width:420px}
  .search input{width:100%;background:var(--g2);border:1px solid var(--g3);color:var(--t1);border-radius:8px;padding:8px 12px;font-size:13px}
  .pill{padding:4px 10px;border-radius:999px;background:var(--g2);color:var(--t2);font-size:12px}

  main{padding:18px 22px;display:grid;gap:16px;align-content:start}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
  .card{background:var(--g1);text-decoration:none;color:inherit;display:block;border:1px solid var(--g3);border-radius:12px;padding:14px}
  .card b{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
  .card span{color:var(--t3);font-size:12px}
  .card.warn b{color:var(--warn)}
  .card.bad b{color:var(--bad)}

  section{background:var(--g1);border:1px solid var(--g3);border-radius:12px;padding:16px}
  h2{font-size:13px;margin:0 0 12px;color:var(--t2);font-weight:600;display:flex;align-items:center;gap:8px}
  h2 .pill{font-weight:400}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--g3)}
  th{color:var(--t3);font-weight:500;font-size:12px}
  tbody tr:hover{background:light-dark(#F7F8FA,#22262C)}
  tbody tr[data-code]{cursor:pointer}

  label{display:block;font-size:11px;color:var(--t3);margin-bottom:4px}
  input,select{width:100%;background:var(--g2);border:1px solid var(--g3);color:var(--t1);border-radius:8px;padding:8px 10px;font-size:13px}
  input:user-invalid{border-color:var(--bad)}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;margin-bottom:14px}
  .form button{width:100%}

  .tag{font-size:11px;padding:2px 8px;border-radius:999px;display:inline-block}
  .tag.ok,.tag.assist{background:color-mix(in oklab,var(--ok) 18%,transparent);color:var(--ok)}
  .tag.ng,.tag.disabled{background:color-mix(in oklab,var(--bad) 16%,transparent);color:var(--bad)}
  .tag.gray,.tag.candidate,.tag.shadow{background:color-mix(in oklab,var(--warn) 18%,transparent);color:var(--warn)}

  .muted{color:var(--t3);font-size:12px}
  .empty{color:var(--t3);padding:18px 0;font-size:13px;line-height:1.9}
  .empty b{color:var(--t2)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  button.act{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600}
  a.ghost{background:var(--g3);color:var(--t1);border-radius:8px;padding:9px 14px;text-decoration:none;font-size:13px;display:inline-block}
  button.ghost{background:var(--g3);color:var(--t1);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px}
  .todo{display:flex;flex-direction:column;gap:8px}
  .todo a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;background:var(--g2);color:var(--t1);text-decoration:none;font-size:13px}
  .todo a:hover{outline:1px solid var(--g3)}
  .todo .n{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
  .timeline{display:flex;flex-direction:column;gap:0}
  .tl{display:grid;grid-template-columns:150px 90px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--g3);font-size:13px}
  .tl time{color:var(--t3);font-variant-numeric:tabular-nums;font-size:12px}
  .kind{font-size:11px;color:var(--t3)}
  .review{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
  .review-list{background:var(--g1);border:1px solid var(--g3);border-radius:12px;padding:16px}
  .review-detail{background:var(--g1);border:1px solid var(--g3);border-radius:12px;padding:16px}
  .queue{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
  .item{display:flex;align-items:center;gap:8px;padding:9px;border-radius:8px;background:var(--g2);cursor:pointer;font-size:13px}
  .item.on{outline:2px solid var(--brand)}
  .refs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .refs h2{font-size:12px;margin:0 0 8px}
  .refrow{display:flex;gap:8px;flex-wrap:wrap}
  .refrow figure{margin:0;width:110px}
  .refrow img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--g3);background:var(--g2)}
  .refrow figcaption{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.4}
  .thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--g3);background:var(--g2)}
  .savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;background:var(--g1);border:1px solid var(--g3);border-radius:12px;padding:12px 16px;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
  .savebar span{flex:1;color:var(--t2);font-size:13px}
  .wiz-step{border:1px solid var(--g3);border-radius:10px;padding:14px;margin-bottom:10px;opacity:.6}
  .wiz-step.cur{opacity:1;border-color:var(--brand);background:var(--g1)}
  .wiz-step.done{opacity:1;border-color:color-mix(in oklab,var(--ok) 50%,transparent)}
  .wiz-head{display:flex;align-items:center;gap:10px;font-size:14px}
  .wiz-no{width:26px;height:26px;border-radius:50%;background:var(--g2);display:flex;align-items:center;justify-content:center;font-weight:700}
  .wiz-step.done .wiz-no{background:color-mix(in oklab,var(--ok) 25%,transparent);color:var(--ok)}
  .wiz-step.cur .wiz-no{background:var(--brand);color:#fff}
  .wiz-body{margin-top:12px}
  .chip-static{background:var(--g2);border:1px solid var(--g3);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--t2)}
  .item .score{width:48px;font-variant-numeric:tabular-nums;color:var(--t2)}
  .shot{background:var(--g2);border-radius:10px;min-height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px}
  .shot img{max-width:100%;max-height:420px;image-rendering:pixelated}
  .kv{display:grid;grid-template-columns:80px 1fr;gap:6px 10px;font-size:13px}
  .kv div:nth-child(odd){color:var(--t3)}
  .reasons{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .reasons button.sel{background:var(--brand);color:#fff}
  .row{display:flex;gap:8px}
  .row button{flex:1}
  dialog{background:var(--g1);color:var(--t1);border:1px solid var(--g3);border-radius:12px;padding:20px;width:min(520px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  dialog label{display:block;font-size:11px;color:var(--t3);margin:10px 0 4px}
  dialog input,dialog select{width:100%;background:var(--g2);border:1px solid var(--g3);color:var(--t1);border-radius:8px;padding:9px 10px;font-size:13px}
  #toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:99}
  #toasts output{padding:12px 16px;border-radius:10px;color:#fff;font-size:13px;background:var(--ok)}
  #toasts output[data-kind="bad"]{background:var(--bad)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="logo"><i></i>AIP 服务端</div>
    <nav aria-label="主导航">
      <a href="#/workbench" data-nav="workbench">工作台</a>
      <div class="group">生产</div>
      <a href="#/wizard" data-nav="wizard">新建向导</a>
      <a href="#/catalog" data-nav="catalog">编码与模型</a>
      <div class="group">质量</div>
      <a href="#/quality" data-nav="quality">复核队列</a>
      <a href="#/cases" data-nav="cases">判例库</a>
      <a href="#/datasets" data-nav="datasets">数据集</a>
      <a href="#/blind" data-nav="blind">抽检</a>
      <div class="group">其他</div>
      <a href="#/training" data-nav="training">训练与发布</a>
      <a href="#/system" data-nav="system">系统</a>
      <a href="#/settings" data-nav="settings">设置</a>
    </nav>
    <div class="side-foot">v0.1.0 · 开发机</div>
  </aside>

  <div>
    <header>
      <h1 id="title">工作台</h1>
      <div class="search">
        <label class="sr-only" for="jump">跳转到编码</label>
        <input id="jump" placeholder="输入编码回车直达，例如 AB-1234-01">
      </div>
      <span class="pill" id="health" role="status">健康检查中…</span>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<dialog id="auditDlg">
  <h2 id="auditTitle" style="margin-bottom:12px">数据集核对</h2>
  <table><caption class="sr-only">成员变化</caption>
    <thead><tr><th scope="col">判例</th><th scope="col">变化</th><th scope="col">说明</th></tr></thead>
    <tbody id="auditBody"></tbody></table>
  <div class="row" style="margin-top:14px"><button class="ghost" onclick="this.closest('dialog').close()">关闭</button></div>
</dialog>

<dialog id="dsPickDlg">
  <form method="dialog" id="dsPickForm">
    <h2 style="margin-bottom:12px">加入数据集（<span id="dsPickCount">0</span> 条判例）</h2>
    <label for="dsPickList">选一个草稿数据集</label>
    <select id="dsPickList"></select>
    <p class="muted" style="margin:12px 0 4px">或新建：</p>
    <label for="dsPickModel">模型</label><select id="dsPickModel"></select>
    <label for="dsPickName">名称</label><input id="dsPickName" placeholder="M1-2026-W46">
    <div class="row" style="margin-top:16px">
      <button class="act" id="dsPickSave" value="save">加入</button>
      <button class="ghost" value="cancel">取消</button>
    </div>
  </form>
</dialog>

<dialog id="shotDlg">
  <h2 id="shotDlgTitle" style="margin-bottom:12px">结果</h2>
  <img id="shotDlgImg" alt="裁片" style="max-width:100%;border-radius:10px">
  <div class="row" style="margin-top:14px"><button class="ghost" value="close" onclick="this.closest('dialog').close()">关闭</button></div>
</dialog>

<dialog id="caseDlg">
  <form method="dialog" id="caseForm">
    <h2 style="margin-bottom:12px">录入判例</h2>
    <label for="f_code">编码</label><input id="f_code" required placeholder="AB-1234-01">
    <label for="f_file">上传裁片</label><input id="f_file" type="file" accept="image/png,image/jpeg">
    <label for="f_path">或手填已有路径</label><input id="f_path" placeholder="data/crops/xxx.png">
    <label for="f_part">件号（同件只录一条）</label><input id="f_part" placeholder="P-20261114-001">
    <label for="f_verdict">结论</label>
    <select id="f_verdict"><option value="ok">可接受 ok</option><option value="ng">不可接受 ng</option></select>
    <label for="f_reason">一句话理由</label><input id="f_reason" placeholder="边部划痕">
    <label for="f_source">来源</label>
    <select id="f_source"><option value="manual">手工录入</option><option value="result">复核转</option><option value="import">导入</option></select>
    <label for="f_adj">裁决人</label><input id="f_adj" value="admin" required>
    <div class="row" style="margin-top:16px">
      <button class="act" id="f_save" value="save">保存</button>
      <button class="ghost" value="cancel">取消</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, opts) {
  const resp = await fetch(path, opts);
  const text = await resp.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = { raw: text }; }
  if (!resp.ok) {
    const err = new Error(body?.message || body?.detail?.message || resp.statusText);
    err.body = body; err.status = resp.status;
    throw err;
  }
  return body;
}
const post = (p, b) => api(p, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(b)});

function toast(msg, bad=false) {
  const out = document.createElement("output");
  out.textContent = msg;
  if (bad) out.dataset.kind = "bad";
  $("toasts").append(out);
  setTimeout(() => out.remove(), 2600);
}
const tag = (label) => `<span class="tag ${esc(label)}">${esc(label)}</span>`;
const fmtTime = (s) => s ? s.replace("T", " ").replace(/\.\d+Z$/, "") : "-";

const ACTIONS = {
  "version.status": "版本状态变更", "binding.create": "绑定模型", "binding.unbind": "解除绑定",
  "config.create": "保存 ROI", "threshold.create": "保存阈值",
  "review.confirm": "复核确认", "review.claim": "领取", "review.skip": "暂缓",
  "review.release": "释放", "review.restore": "恢复暂缓",
  "case.create": "录入判例", "case.patch": "修改判例", "case.delete": "删除判例",
  "case.archive": "归档判例", "case.restore": "恢复判例", "case.conflict": "判例冲突",
  "setting.update": "修改设置", "train.start": "启动训练", "train.cancel": "取消训练",
  "model.rollback": "回滚版本", "model.archive": "归档模型", "model.patch": "模型改名",
  "code.patch": "修改编码", "code.active": "启用/停用编码",
  "code.archive": "归档编码", "code.restore": "恢复编码", "family.create": "新建族",
  "dataset.create": "新建数据集", "dataset.add": "加入判例", "dataset.remove": "移出判例",
  "dataset.freeze": "冻结数据集", "batch.backfill": "回填批次",
  "blind.create": "建抽检批次", "blind.close": "关闭抽检批次",
  "model.smoke": "冒烟试判", "setting.bulk_update": "批量修改设置", "train.cancel": "取消训练",
};
const actionLabel = (a) => ACTIONS[a] || a;

/* ---------- 视图 ---------- */

async function renderWorkbench() {
  const [stats, overview, audit] = await Promise.all([
    api("/api/stats/today"), api("/api/overview"), api("/api/audit/recent?limit=8")
  ]);
  const candidates = (await api("/api/models")).flatMap(m =>
    m.versions.filter(v => v.status === "candidate").map(v => ({model: m.code, vno: v.version_no})));
  const badStations = overview.stations.filter(s => s.health !== "ok");

  const todos = [];
  let hint = "";
  if (overview.pending_review > 0) todos.push({href:"#/quality", text:"待复核的判定", n: overview.pending_review});
  if (candidates.length) todos.push({href:"#/training", text:"待发布的候选版本", n: candidates.length});
  if (badStations.length) todos.push({href:"#/system", text:"异常站位", n: badStations.length});
  if (overview.cases === 0) hint = "判例库还是空的，录一条之后复核就有参考样例了";

  $("view").innerHTML = `
    <div class="cards">
      <a class="card" href="#/quality"><span>今日判定</span><b>${stats.total}</b></a>
      <a class="card" href="#/quality?label=ng"><span>NG</span><b>${stats.ng}</b></a>
      <a class="card warn" href="#/quality?label=gray"><span>灰区</span><b>${stats.gray}</b></a>
      <a class="card bad" href="#/quality"><span>待复核</span><b>${stats.pending_review}</b></a>
      <a class="card" href="#/quality"><span>NG 率</span><b>${(stats.ng_rate*100).toFixed(1)}%</b></a>
      <a class="card" href="#/quality"><span>灰区率</span><b>${(stats.gray_rate*100).toFixed(1)}%</b></a>
    </div>

    <section>
      <h2>要你处理的 <span class="pill">${todos.length} 项</span></h2>
      <div class="todo">
        ${todos.length ? todos.map(t => `<a href="${t.href}"><span>${esc(t.text)}</span><span class="n">${t.n}</span></a>`).join("")
          : `<div class="empty">今天没有待处理事项。${hint ? "<br>" + esc(hint) : ""}</div>`}
      </div>
    </section>

    <section>
      <h2>存储维护</h2>
      <p class="muted" style="margin:0 0 12px">
        判例引用的图与待复核证据永不自动删；其余按保留期清理（设置 → 存储）。
      </p>
      <div class="row">
        <button class="ghost" id="btnPreview">预览可清理</button>
        <button class="ghost" id="btnClean">执行清理</button>
      </div>
      <div id="storageOut" class="muted" style="margin-top:10px"></div>
    </section>

    <section>
      <h2>最近操作</h2>
      ${audit.length ? `<div class="timeline">${audit.map(a => `
        <div class="tl"><time>${fmtTime(a.created_at)}</time><span class="kind">${esc(actionLabel(a.action))}</span>
        <span>${esc(a.actor)} · ${esc(a.entity)}${a.entity_id ? " #" + esc(a.entity_id) : ""}</span></div>`).join("")}</div>`
        : `<div class="empty">还没有记录。改阈值、换绑定、发布版本都会出现在这里。</div>`}
    </section>`;
}

let showArchived = false;

let wiz = { code: "", modelId: null };

async function renderWizard() {
  const [codes, models, bindings, datasets] = await Promise.all([
    api("/api/codes"), api("/api/models"), api("/api/bindings"), api("/api/datasets")
  ]);
  const codeRow = codes.find(c => c.code === wiz.code);
  const binding = wiz.code ? bindings.find(b => b.code === wiz.code && !b.active_to) : null;
  const model = binding ? models.find(m => m.id === binding.model_id) : null;
  const cases = wiz.code ? await api("/api/cases?code=" + encodeURIComponent(wiz.code) + "&limit=200") : [];
  const versions = model ? model.versions : [];
  const candidate = versions.find(v => v.status === "candidate");
  const assist = versions.find(v => v.status === "assist");

  const steps = [
    { title: "建编码", done: !!codeRow, hint: "产品编码是入口，操作工只认它" },
    { title: "建模型并绑定", done: !!binding, hint: "模型提供判断能力，一个模型可服务多个编码" },
    { title: "导入样品判例", done: cases.length > 0, hint: "每张图给一个结论，判例是训练数据来源" },
    { title: "数据集冻结并训练", done: !!candidate || !!assist, hint: "训练只读冻结快照，可复现" },
    { title: "冒烟并发布", done: !!assist, hint: "用候选版本试判一张图，再发布为生效" },
  ];
  const current = steps.findIndex(s => !s.done);

  const step = (i, body) => `
    <div class="wiz-step ${steps[i].done ? "done" : i === current ? "cur" : ""}">
      <div class="wiz-head">
        <span class="wiz-no">${steps[i].done ? "✓" : i + 1}</span>
        <b>${steps[i].title}</b>
        <span class="muted">${steps[i].hint}</span>
      </div>
      ${i === current ? `<div class="wiz-body">${body}</div>` : ""}
    </div>`;

  $("view").innerHTML = `
    <section>
      <h2>新建向导 <span class="pill">一条链路：编码 → 模型 → 样品 → 训练 → 发布</span></h2>
      <p class="muted" style="margin:0 0 12px">只显示当前该做的一步；完成后自动进入下一步，随时可从左侧导航离开。</p>
      ${step(0, `<div class="form">
          <div><label for="wz_code">编码</label><input id="wz_code" placeholder="AB-1234-01"></div>
          <div><label for="wz_family">族</label><input id="wz_family" list="wzFamilies" placeholder="支架类"></div>
          <div><label for="wz_part">零件</label><input id="wz_part" placeholder="全型"></div>
          <div><button class="act" id="wzCreateCode">建编码</button></div>
        </div>
        ${codes.length ? `<div class="form"><div><label for="wz_pick">或选择已有编码</label>
          <select id="wz_pick"><option value="">—</option>${codes.map(c => `<option value="${esc(c.code)}">${esc(c.code)}</option>`).join("")}</select>
        </div></div>` : ""}`)}

      ${step(1, `<div class="form">
          <div><label for="wz_model">模型编码</label><input id="wz_model" placeholder="M1"></div>
          <div><label for="wz_model_name">名称</label><input id="wz_model_name" placeholder="支架-全型"></div>
          <div><button class="act" id="wzCreateModel">建模型并绑定到 ${esc(wiz.code)}</button></div>
        </div>
        ${models.length ? `<div class="form"><div><label for="wz_model_pick">或绑定已有模型</label>
          <select id="wz_model_pick"><option value="">—</option>${models.map(m => `<option value="${m.id}">${esc(m.code)} ${esc(m.name || "")}</option>`).join("")}</select>
        </div></div>` : ""}`)}

      ${step(2, `<div class="form">
          <div><label for="wz_file">裁片</label><input id="wz_file" type="file" accept="image/png,image/jpeg"></div>
          <div><label for="wz_verdict">结论</label><select id="wz_verdict"><option value="ok">可接受 ok</option><option value="ng">缺陷 ng</option></select></div>
          <div><button class="act" id="wzAddCase">录入判例</button></div>
        </div>
        <p class="muted">已录入 <b>${cases.length}</b> 条。建议先录 5–10 条（含至少 1 条 NG）再训练。</p>`)}

      ${step(3, `<div class="form">
          <div><button class="act" id="wzTrain">建数据集 → 冻结 → 训练</button></div>
        </div>
        <p class="muted">数据集会自动包含该编码的全部判例，并冻结校验和。</p>`)}

      ${step(4, `<div class="form">
          <div><label for="wz_smoke">冒烟图</label><input id="wz_smoke" type="file" accept="image/png,image/jpeg"></div>
          <div><button class="act" id="wzSmoke">用候选版本试判</button></div>
        </div>
        <div id="wzSmokeOut" class="muted"></div>
        ${candidate ? `<div class="row" style="margin-top:10px"><button class="act" id="wzPublish">发布 v${candidate.version_no} 为生效</button></div>` : ""}
        ${assist ? `<p class="muted">已发布：v${assist.version_no} 生效中。</p>` : ""}`)}
    </section>`;

  if (!codeRow && codes.length) {
    $("wz_pick").onchange = (e) => { if (e.target.value) { wiz.code = e.target.value; renderWizard(); } };
  }
  if ($("wzCreateCode")) {
    $("wzCreateCode").onclick = async () => {
      try {
        await post("/api/codes", {code: $("wz_code").value.trim(), family: $("wz_family").value.trim() || null, part: $("wz_part").value.trim() || null});
        wiz.code = $("wz_code").value.trim();
        toast("编码已创建");
        renderWizard();
      } catch (e) { toast(e.message, true); }
    };
  }
  if ($("wzCreateModel")) {
    $("wzCreateModel").onclick = async () => {
      try {
        const m = await post("/api/models", {code: $("wz_model").value.trim(), name: $("wz_model_name").value.trim() || null});
        await post("/api/bindings", {code: wiz.code, model_id: m.id});
        wiz.modelId = m.id;
        toast("模型已创建并绑定");
        renderWizard();
      } catch (e) { toast(e.message, true); }
    };
  }
  if ($("wz_model_pick")) {
    $("wz_model_pick").onchange = async (e) => {
      if (!e.target.value) return;
      try {
        await post("/api/bindings", {code: wiz.code, model_id: Number(e.target.value)});
        toast("已绑定");
        renderWizard();
      } catch (err) { toast(err.message, true); }
    };
  }
  if ($("wzAddCase")) {
    $("wzAddCase").onclick = async () => {
      const file = $("wz_file").files[0];
      if (!file) { toast("先选一张裁片", true); return; }
      try {
        const form = new FormData();
        form.append("file", file);
        const up = await api("/api/cases/upload", {method: "POST", body: form});
        await post("/api/cases", {
          code: wiz.code, crop_path: up.crop_path, verdict: $("wz_verdict").value,
          adjudicator: "admin", part_no: "WIZ-" + Date.now()
        });
        toast("判例已录入");
        renderWizard();
      } catch (e) { toast(e.message, true); }
    };
  }
  if ($("wzTrain")) {
    $("wzTrain").onclick = async () => {
      try {
        const ds = await post("/api/datasets", {model_id: model.id, name: `WIZ-${wiz.code}-${new Date().toISOString().slice(0, 10)}`});
        await post(`/api/datasets/${ds.id}/items`, {case_ids: cases.map(c => c.id)});
        await post(`/api/datasets/${ds.id}/freeze`, {});
        const job = await post("/api/train", {model_id: model.id, dataset_id: ds.id});
        toast(`训练完成，产出 v${job.version_no}`);
        renderWizard();
      } catch (e) { toast(e.message, true); }
    };
  }
  if ($("wzSmoke")) {
    $("wzSmoke").onclick = async () => {
      const file = $("wz_smoke").files[0];
      if (!file) { toast("先选一张冒烟图", true); return; }
      try {
        const form = new FormData();
        form.append("file", file);
        const r = await api(`/api/models/${model.id}/versions/${(candidate || assist).version_no}/smoke`, {method: "POST", body: form});
        if (!r.passed) {
          $("wzSmokeOut").innerHTML = `<div class="banner warn">冒烟未通过：${esc(r.message)}<small>${esc(r.action)}</small></div>`;
          return;
        }
        const color = r.label === "ok" ? "ok" : r.label === "ng" ? "bad" : "warn";
        $("wzSmokeOut").innerHTML = `<div class="banner ${color}">${r.label.toUpperCase()} · 分数 ${r.score.toFixed(3)}<small>阈值 ${r.th_lo} / ${r.th_hi}</small></div>`;
      } catch (e) { toast(e.message, true); }
    };
  }
  if ($("wzPublish")) {
    $("wzPublish").onclick = async () => {
      if (!confirm("发布后该模型下所有编码立即使用新版本，旧版本降为已停用。确认？")) return;
      try {
        await api(`/api/models/${model.id}/versions/${candidate.version_no}/status`, {
          method: "PUT", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({status: "assist"})
        });
        toast(`v${candidate.version_no} 已发布`);
        renderWizard();
      } catch (e) { toast(e.message, true); }
    };
  }
}

let reviewState = { code: "", family: "", batch: "", label: "", sort: "oldest", groupBy: "part" };

function ageText(iso) {
  if (!iso) return "-";
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return "-";
  const mins = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (mins < 60) return mins + " 分钟";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + " 小时 " + (mins % 60) + " 分";
  return Math.floor(hours / 24) + " 天";
}

async function renderQuality() {
  // 深链：/#/quality?group=batch|family|code|part 直接进入分组视图
  const deep = new URLSearchParams(location.hash.split("?")[1] || "");
  if (deep.get("group")) reviewState.groupBy = deep.get("group");
  const params = new URLSearchParams({group_by: reviewState.groupBy, sort: reviewState.sort, limit: "50"});
  if (reviewState.code) params.set("code", reviewState.code);
  if (reviewState.family) params.set("family", reviewState.family);
  if (reviewState.batch) params.set("batch", reviewState.batch);
  if (reviewState.label) params.set("label", reviewState.label);

  const [q, codes, settings, families] = await Promise.all([
    api("/review/queue?" + params), api("/api/codes"), api("/api/settings"), api("/api/families")
  ]);
  const autoRefs = !settings.some(r => r.key === "review.show_references_default" && r.value === false);
  const items = q.items;
  const isGroup = ["code", "family", "batch"].includes(reviewState.groupBy);
  let idx = 0;
  let reason = null;
  const REASONS = ["划痕", "脏污", "压伤", "误报", "其他"];
  const actor = "admin";

  const filters = `
    <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div><label for="fq_code">编码</label>
        <select id="fq_code"><option value="">全部</option>
          ${codes.map(c => `<option value="${esc(c.code)}" ${reviewState.code === c.code ? "selected" : ""}>${esc(c.code)}</option>`).join("")}
        </select></div>
      <div><label for="fq_family">族</label>
        <select id="fq_family"><option value="">全部</option>
          ${families.map(f => `<option value="${esc(f.name)}" ${reviewState.family === f.name ? "selected" : ""}>${esc(f.name)}</option>`).join("")}
        </select></div>
      <div><label for="fq_batch">批次</label>
        <input id="fq_batch" value="${esc(reviewState.batch)}" placeholder="精确批次号"></div>
      <div><label for="fq_label">结论</label>
        <select id="fq_label">
          <option value="">全部</option>
          <option value="ng" ${reviewState.label === "ng" ? "selected" : ""}>仅 NG</option>
          <option value="gray" ${reviewState.label === "gray" ? "selected" : ""}>仅灰区</option>
        </select></div>
      <div><label for="fq_sort">排序</label>
        <select id="fq_sort">
          <option value="oldest" ${reviewState.sort === "oldest" ? "selected" : ""}>最旧优先</option>
          <option value="newest" ${reviewState.sort === "newest" ? "selected" : ""}>最新优先</option>
          <option value="score_desc" ${reviewState.sort === "score_desc" ? "selected" : ""}>分数高→低</option>
          <option value="score_asc" ${reviewState.sort === "score_asc" ? "selected" : ""}>分数低→高</option>
        </select></div>
      <div><label for="fq_group">视图</label>
        <select id="fq_group">
          <option value="part" ${reviewState.groupBy === "part" ? "selected" : ""}>按件聚合</option>
          <option value="code" ${reviewState.groupBy === "code" ? "selected" : ""}>按编码</option>
          <option value="family" ${reviewState.groupBy === "family" ? "selected" : ""}>按族</option>
          <option value="batch" ${reviewState.groupBy === "batch" ? "selected" : ""}>按批次</option>
          <option value="result" ${reviewState.groupBy === "result" ? "selected" : ""}>按单条结果</option>
        </select></div>
    </div>`;

  if (items.length === 0) {
    $("view").innerHTML = `
      <section><h2>复核队列</h2>${filters}
        <div class="empty">没有待处理的件。<b>什么时候会有</b>：判定为 NG 或灰区、且还没人确认时。</div></section>`;
  } else {
    $("view").innerHTML = `
      <section>
        <h2>复核队列 <span class="pill">${q.summary.total} 条待复核</span>
          <span class="pill">最旧 ${ageText(q.summary.oldest_at)}</span>
          ${q.summary.skipped_count > 0
            ? `<span style="margin-left:auto"><button class="ghost" id="btnSkipped">暂缓件 ${q.summary.skipped_count}</button></span>`
            : ""}</h2>
        ${filters}
        <div id="skippedWrap" hidden style="margin-bottom:12px">
          <table><caption class="sr-only">暂缓件</caption>
            <thead><tr><th scope="col">#</th><th scope="col">编码</th><th scope="col">件号</th><th scope="col">分数</th><th scope="col">原因</th><th scope="col">暂缓人</th><th scope="col">时间</th><th scope="col">操作</th></tr></thead>
            <tbody id="skippedRows"></tbody></table>
        </div>
        <div class="chips" style="margin-bottom:12px">
          ${q.summary.by_code.map(c => `<span class="chip-static">${esc(c.code)} · ${c.count}</span>`).join("")}
        </div>
      </section>
      <section class="review">
        <div class="review-list">
          <h2>待复核 <span class="pill">${items.length}</span></h2>
          <div id="rlist" class="queue"></div>
          <div class="muted" style="margin-top:10px">${isGroup ? "点击分组下钻到件" : "J/K 切换 · Enter 接受 · X 改判 · 1–5 选理由"}</div>
        </div>
        <div class="review-detail">
          <div class="shot"><img id="shot" alt="裁片"></div>
          <div class="kv" id="rmeta"></div>
          <div id="rshots" class="muted" style="margin-top:10px"></div>
          <div style="margin-top:10px">
            <button class="ghost" id="rRefBtn">参考样例（可能影响判断）</button>
            <div id="rRefs" hidden style="margin-top:10px"></div>
          </div>
          <div class="reasons" id="rreasons">
            ${REASONS.map((r, i) => `<button class="ghost" data-r="${r}">${i + 1}. ${r}</button>`).join("")}
          </div>
          <div class="row" style="margin-bottom:8px">
            <button class="ghost" id="rClaim">领取这一件</button>
            <button class="ghost" id="rSkip" disabled>暂缓（先选理由）</button>
          </div>
          <div class="row">
            <button class="act" id="rAccept">接受系统结论</button>
            <button class="ghost" id="rFlip">改判</button>
          </div>
        </div>
      </section>`;

    const groupIds = (it) => it.kind === "part" ? it.result_ids : [it.id];

    function paint() {
      $("rlist").innerHTML = items.map((it, i) => {
        if (["code", "family", "batch"].includes(it.kind)) {
          return `<div class="item" data-i="${i}">
            <span style="flex:1;font-weight:600">${esc(it.key)}</span>
            <span class="pill">${it.parts} 件 / ${it.count} 条</span>
            <span class="pill">${ageText(it.first_at)}</span>
            <span class="muted">点击下钻 →</span>
          </div>`;
        }
        const ids = groupIds(it);
        const label = it.kind === "part"
          ? `<span class="pill">${it.count} 张</span>`
          : tag(it.label);
        const score = it.kind === "part"
          ? `${it.min_score.toFixed(2)}–${it.max_score.toFixed(2)}`
          : it.score.toFixed(3);
        const partNo = it.part_no || "-";
        return `<div class="item ${i === idx ? "on" : ""}" data-i="${i}">
          <span class="score">${score}</span>
          ${label}
          <span style="flex:1">${esc(it.code)} · ${esc(partNo)}</span>
          <span class="pill">${ageText(it.first_at || it.created_at)}</span>
        </div>`;
      }).join("");
      document.querySelectorAll("#rlist .item").forEach(el => {
        el.onclick = () => {
          const i = Number(el.dataset.i);
          const it = items[i];
          if (["code", "family", "batch"].includes(it.kind)) {
            if (it.kind === "code") reviewState.code = it.key;
            if (it.kind === "family") reviewState.family = it.key;
            if (it.kind === "batch") reviewState.batch = it.key;
            reviewState.groupBy = "part";
            renderQuality();
            return;
          }
          idx = i; reason = null; paint();
        };
      });

      if (isGroup) {
        $("shot").parentElement.style.display = "none";
        $("rmeta").innerHTML = "<div>提示</div><div>点击左侧分组下钻到件</div>";
        $("rshots").textContent = "";
        $("rRefs").hidden = true;
        $("rRefBtn").parentElement.style.display = "none";
        document.querySelector("#rreasons").parentElement.style.display = "none";
        document.querySelector("#rClaim").parentElement.style.display = "none";
        document.querySelector("#rAccept").parentElement.parentElement.style.display = "none";
        return;
      }
      $("shot").parentElement.style.display = "";
      $("rRefBtn").parentElement.style.display = "";
      document.querySelector("#rreasons").parentElement.style.display = "";
      document.querySelector("#rClaim").parentElement.style.display = "";
      document.querySelector("#rAccept").parentElement.parentElement.style.display = "";

      const cur = items[idx];
      const ids = groupIds(cur);
      $("shot").src = `/results/${ids[0]}/image`;
      $("rmeta").innerHTML = `
        <div>编码</div><div>${esc(cur.code)}</div>
        <div>件号</div><div>${esc(cur.part_no || "-")}</div>
        <div>待处理</div><div>${ids.length} 张</div>
        <div>系统结论</div><div>${cur.kind === "part" ? `NG/灰区 ${cur.count} 张` : tag(cur.label)}</div>
        <div>分数</div><div>${cur.kind === "part" ? cur.min_score.toFixed(3) + " ~ " + cur.max_score.toFixed(3) : cur.score.toFixed(3)}</div>
        <div>批次</div><div>${esc(cur.batch_no || "-")}</div>
        <div>首次时间</div><div>${fmtTime(cur.first_at || cur.created_at)}</div>
        <div>位置</div><div>${idx + 1} / ${items.length}</div>`;
      $("rshots").textContent = "结果号：" + ids.join(", ");
      $("rRefs").hidden = true;
      $("rRefs").innerHTML = "";
      if (autoRefs) loadRefs();
      document.querySelectorAll("#rreasons button").forEach(b => b.classList.toggle("sel", b.dataset.r === reason));
    }

    async function each(ids, fn) {
      for (const id of ids) { try { await fn(id); } catch (e) { toast(`#${id}: ${e.message}`, true); } }
    }

    async function confirmGroup(opts) {
      const cur = items[idx];
      await each(groupIds(cur), (id) => post(`/review/${id}/confirm`, {...opts, note: reason, confirmed_by: actor}));
      toast(`已确认 ${groupIds(cur).length} 张`);
      renderQuality();
    }

    function removeCurrent() {
      items.splice(idx, 1);
      reason = null;
      if (items.length === 0) return renderQuality();
      idx = Math.min(idx, items.length - 1);
      paint();
    }

    paint();
    document.querySelectorAll("#rreasons button").forEach(b => {
      b.onclick = () => {
        reason = b.dataset.r;
        paint();
        $("rSkip").disabled = false;
        $("rSkip").textContent = "暂缓";
      };
    });
    async function loadRefs() {
      const cur = items[idx];
      const ids = groupIds(cur);
      const box = $("rRefs");
      try {
        const refs = await api(`/results/${ids[0]}/references`);
        const card = (c) => `<figure><img src="${c.image_url}" alt="${esc(c.verdict)} 样例" loading="lazy">
          <figcaption>${esc(c.reason || "无理由")}</figcaption></figure>`;
        box.innerHTML = `
          <div class="refs">
            <div><h2>OK 样例 <span class="pill">${refs.ok.length}</span></h2>
              <div class="refrow">${refs.ok.length ? refs.ok.map(card).join("") : '<span class="muted">暂无</span>'}</div></div>
            <div><h2>NG 样例 <span class="pill">${refs.ng.length}</span></h2>
              <div class="refrow">${refs.ng.length ? refs.ng.map(card).join("") : '<span class="muted">暂无</span>'}</div></div>
          </div>
          ${refs.note ? `<p class="muted" style="margin:8px 0 0">${esc(refs.note)}</p>` : ""}`;
        box.hidden = false;
        $("rRefBtn").textContent = "收起参考样例";
      } catch (e) { toast(e.message, true); }
    }

    $("rRefBtn").onclick = async () => {
      const box = $("rRefs");
      if (!box.hidden) {
        box.hidden = true;
        box.innerHTML = "";
        $("rRefBtn").textContent = "参考样例（可能影响判断）";
        return;
      }
      await loadRefs();
    };

    // 深链：/#/quality?refs=0 强制收起（培训时想先自己判）
    if (new URLSearchParams(location.hash.split("?")[1] || "").get("refs") === "0") {
      $("rRefs").hidden = true;
      $("rRefBtn").textContent = "参考样例（可能影响判断）";
    }

    $("rClaim").onclick = async () => {
      await each(groupIds(items[idx]), (id) => post(`/review/${id}/claim`, {actor}));
      toast("已领取");
    };
    $("rSkip").onclick = async () => {
      if (!reason) { toast("暂缓前先选一个理由", true); return; }
      const cur = items[idx];
      await each(groupIds(cur), (id) => post(`/review/${id}/skip`, {actor, reason}));
      toast("已暂缓");
      removeCurrent();
    };
    $("rAccept").onclick = () => confirmGroup({});          // 各张保留各自结论
    $("rFlip").onclick = () => {
      if (!reason) { toast("改判前先选一个理由", true); return; }
      confirmGroup({flip: true});                            // 各张翻转到相反结论
    };

    window.__reviewKeys = (ev) => {
      if (ev.key === "j" || ev.key === "J") { idx = Math.min(idx + 1, items.length - 1); reason = null; paint(); }
      else if (ev.key === "k" || ev.key === "K") { idx = Math.max(idx - 1, 0); reason = null; paint(); }
      else if (ev.key === "Enter") { ev.preventDefault(); $("rAccept").click(); }
      else if (ev.key === "x" || ev.key === "X") { $("rFlip").click(); }
      else if (/^[1-5]$/.test(ev.key)) { reason = REASONS[Number(ev.key) - 1]; paint(); }
    };

    if ($("btnSkipped")) {
      $("btnSkipped").onclick = async () => {
        const wrap = $("skippedWrap");
        wrap.hidden = !wrap.hidden;
        if (wrap.hidden) return;
        const data = await api("/review/skipped" + (reviewState.code ? "?code=" + encodeURIComponent(reviewState.code) : ""));
        $("skippedRows").innerHTML = data.items.length === 0
          ? '<tr><td colspan="8" class="empty">没有暂缓的件</td></tr>'
          : data.items.map(s => `<tr>
              <td>${s.id}</td><td>${esc(s.code)}</td><td>${esc(s.part_no || "-")}</td>
              <td>${s.score.toFixed(3)}</td><td>${esc(s.reason || "-")}</td>
              <td>${esc(s.claimed_by || "-")}</td><td class="muted">${fmtTime(s.claimed_at)}</td>
              <td><button class="ghost" data-unskip="${s.id}">恢复暂缓</button></td>
            </tr>`).join("");
        document.querySelectorAll("[data-unskip]").forEach(btn => {
          btn.onclick = async () => {
            await post(`/review/${btn.dataset.unskip}/restore`, {actor: "admin"});
            toast("已恢复到队列");
            renderQuality();
          };
        });
      };
    }

    $("fq_code").onchange = (e) => { reviewState.code = e.target.value; renderQuality(); };
    $("fq_family").onchange = (e) => { reviewState.family = e.target.value; renderQuality(); };
    $("fq_batch").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      reviewState.batch = e.target.value.trim();
      renderQuality();
    });
    $("fq_label").onchange = (e) => { reviewState.label = e.target.value; renderQuality(); };
    $("fq_sort").onchange = (e) => { reviewState.sort = e.target.value; renderQuality(); };
    $("fq_group").onchange = (e) => { reviewState.groupBy = e.target.value; renderQuality(); };
  }

  if (items.length === 0) {
    if ($("btnSkipped")) {
      $("btnSkipped").onclick = async () => {
        const wrap = $("skippedWrap");
        wrap.hidden = !wrap.hidden;
        if (wrap.hidden) return;
        const data = await api("/review/skipped" + (reviewState.code ? "?code=" + encodeURIComponent(reviewState.code) : ""));
        $("skippedRows").innerHTML = data.items.length === 0
          ? '<tr><td colspan="8" class="empty">没有暂缓的件</td></tr>'
          : data.items.map(s => `<tr>
              <td>${s.id}</td><td>${esc(s.code)}</td><td>${esc(s.part_no || "-")}</td>
              <td>${s.score.toFixed(3)}</td><td>${esc(s.reason || "-")}</td>
              <td>${esc(s.claimed_by || "-")}</td><td class="muted">${fmtTime(s.claimed_at)}</td>
              <td><button class="ghost" data-unskip="${s.id}">恢复暂缓</button></td>
            </tr>`).join("");
        document.querySelectorAll("[data-unskip]").forEach(btn => {
          btn.onclick = async () => {
            await post(`/review/${btn.dataset.unskip}/restore`, {actor: "admin"});
            toast("已恢复到队列");
            renderQuality();
          };
        });
      };
    }

    $("fq_code").onchange = (e) => { reviewState.code = e.target.value; renderQuality(); };
    $("fq_family").onchange = (e) => { reviewState.family = e.target.value; renderQuality(); };
    $("fq_batch").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      reviewState.batch = e.target.value.trim();
      renderQuality();
    });
    $("fq_label").onchange = (e) => { reviewState.label = e.target.value; renderQuality(); };
    $("fq_sort").onchange = (e) => { reviewState.sort = e.target.value; renderQuality(); };
    $("fq_group").onchange = (e) => { reviewState.groupBy = e.target.value; renderQuality(); };
  }
}

async function renderSettings() {
  const rows = await api("/api/settings");
  const groups = [...new Set(rows.map(r => r.group))];
  const dirty = new Map();

  $("view").innerHTML = `
    <section>
      <h2>设置 <span class="pill">运行时可改 · 改动记审计</span></h2>
      <p class="muted" style="margin:0 0 14px">
        这里只放运行时可改的项。端口、数据库路径、白名单路径属于启动级配置，改了会断服务，不放在页面上。
      </p>
      ${groups.map(g => `
        <h2 style="margin-top:18px">${esc(g)}</h2>
        <table><caption class="sr-only">${esc(g)} 配置</caption>
          <thead><tr><th scope="col">项</th><th scope="col">当前值</th><th scope="col">默认</th><th scope="col">修改</th></tr></thead>
          <tbody>
            ${rows.filter(r => r.group === g).map(r => {
              const val = Array.isArray(r.value) ? r.value.join(",") : r.value;
              const def = Array.isArray(r.default) ? r.default.join(",") : r.default;
              return `<tr>
                <td>${esc(r.label)}<div class="muted">${esc(r.key)}${r.description ? " · " + esc(r.description) : ""}</div></td>
                <td><input data-k="${esc(r.key)}" data-kind="${r.kind}" value="${esc(val)}" aria-label="${esc(r.label)}"></td>
                <td class="muted">${esc(def)}</td>
                <td class="muted">${r.updated_by ? esc(r.updated_by) + "<br>" + fmtTime(r.updated_at) : "—"}</td>
              </tr>`;
            }).join("")}
          </tbody></table>`).join("")}
    </section>
    <section>
      <h2>为什么有些项不在这里</h2>
      <div class="muted" style="line-height:2">
        <b>启动级</b>：端口、数据库路径、数据目录、日志级别、本班白名单 → 改配置文件后重启。<br>
        <b>版本绑定</b>：ROI、阈值 → 跟模型版本走，改它们等于产生新版本，不在通用设置里。
      </div>
    </section>
    <div class="savebar" id="setBar" hidden>
      <span id="setCount">0 项未保存</span>
      <button class="ghost" id="setReset">放弃修改</button>
      <button class="act" id="setSave">保存修改</button>
    </div>`;

  const bar = $("setBar");
  const count = $("setCount");
  const sync = () => {
    bar.hidden = dirty.size === 0;
    count.textContent = `${dirty.size} 项未保存`;
  };

  document.querySelectorAll("input[data-k]").forEach(inp => {
    inp.addEventListener("input", () => {
      const row = rows.find(r => r.key === inp.dataset.k);
      const text = inp.value;
      let value = text;
      if (row.kind === "int" || row.kind === "float") value = Number(text);
      else if (row.kind === "list") value = text.split(",").map(s => s.trim()).filter(Boolean);
      else if (row.kind === "bool") value = text === "true" || text === "1";
      dirty.set(inp.dataset.k, value);
      sync();
    });
  });

  $("setReset").onclick = () => renderSettings();
  $("setSave").onclick = async () => {
    try {
      const r = await post("/api/settings/bulk", {values: Object.fromEntries(dirty), actor: "web"});
      toast(`已保存 ${r.count} 项`);
      renderSettings();
    } catch (e) { toast(e.message, true); }
  };
}

    <section>
      <h2>最近操作</h2>
      ${audit.length === 0 ? `<div class="empty">还没有审计记录。</div>` : `
      <table><caption class="sr-only">审计</caption>
        <thead><tr><th scope="col">时间</th><th scope="col">动作</th><th scope="col">操作人</th><th scope="col">对象</th></tr></thead>
        <tbody>${audit.map(a => `<tr>
          <td class="muted">${fmtTime(a.created_at)}</td>
          <td>${esc(actionLabel(a.action))}</td>
          <td>${esc(a.actor)}</td>
          <td class="muted">${esc(a.entity)}${a.entity_id ? " #" + esc(a.entity_id) : ""}</td>
        </tr>`).join("")}</tbody></table>`}
    </section>`;
}

let caseState = {code: "", verdict: "", source: "", partNo: "", batchNo: "", conflict: false, showArchived: false, page: 0, pageSize: 25};
let selectedCases = new Set();

async function renderCases() {
  const params = new URLSearchParams({limit: String(caseState.pageSize), offset: String(caseState.page * caseState.pageSize)});
  if (caseState.code) params.set("code", caseState.code);
  if (caseState.verdict) params.set("verdict", caseState.verdict);
  if (caseState.source) params.set("source", caseState.source);
  if (caseState.partNo) params.set("part_no", caseState.partNo);
  if (caseState.batchNo) params.set("batch_no", caseState.batchNo);
  if (caseState.conflict) params.set("conflict", "true");
  if (caseState.showArchived) params.set("include_archived", "true");

  const [data, codes, conflicts] = await Promise.all([
    api("/api/cases/page?" + params), api("/api/codes?include_archived=true"), api("/api/cases/conflicts")
  ]);
  const rows = data.items;
  const total = data.total;
  const pages = Math.max(1, Math.ceil(total / caseState.pageSize));

  const exportCsv = () => {
    const head = ["id", "code", "verdict", "reason", "source", "adjudicator", "created_at"];
    const lines = [head.join(",")].concat(rows.map(r => head.map(k =>
      '"' + String(r[k] ?? "").replace(/"/g, '""') + '"').join(",")));
    const blob = new Blob(["\ufeff" + lines.join("\n")], {type: "text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "cases.csv";
    a.click();
  };

  $("view").innerHTML = `
    <section>
      <h2>判例库 <span class="pill">共 ${total} 条</span>
        ${conflicts.length ? `<span class="pill" style="background:color-mix(in oklab,var(--bad) 18%,transparent);color:var(--bad)">冲突 ${conflicts.length}</span>` : ""}
        <span style="margin-left:auto">
          <button class="ghost" id="btnAddDataset" disabled>加入数据集（0）</button>
          <button class="ghost" id="btnExport">导出 CSV</button>
          <button class="act" id="newCase">录入判例</button>
        </span></h2>

      <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <div><label for="cq_code">编码</label>
          <select id="cq_code"><option value="">全部</option>
            ${codes.map(c => `<option value="${esc(c.code)}" ${caseState.code === c.code ? "selected" : ""}>${esc(c.code)}</option>`).join("")}
          </select></div>
        <div><label for="cq_verdict">结论</label>
          <select id="cq_verdict"><option value="">全部</option>
            <option value="ok" ${caseState.verdict === "ok" ? "selected" : ""}>OK</option>
            <option value="ng" ${caseState.verdict === "ng" ? "selected" : ""}>NG</option>
          </select></div>
        <div><label for="cq_source">来源</label>
          <select id="cq_source"><option value="">全部</option>
            <option value="manual" ${caseState.source === "manual" ? "selected" : ""}>手工</option>
            <option value="result" ${caseState.source === "result" ? "selected" : ""}>复核转</option>
            <option value="import" ${caseState.source === "import" ? "selected" : ""}>导入</option>
          </select></div>
        <div><label for="cq_part">件号</label>
          <input id="cq_part" value="${esc(caseState.partNo || "")}" placeholder="精确件号"></div>
        <div><label for="cq_batch">批次</label>
          <input id="cq_batch" value="${esc(caseState.batchNo || "")}" placeholder="精确批次号"></div>
        <div><label for="cq_arch">归档</label>
          <select id="cq_arch">
            <option value="" ${!caseState.showArchived ? "selected" : ""}>不含已归档</option>
            <option value="1" ${caseState.showArchived ? "selected" : ""}>含已归档</option>
          </select></div>
      </div>

      ${conflicts.length ? `<div class="empty" style="padding:10px 0;color:var(--bad)">
        有 ${conflicts.length} 条冲突：同图被判过不同结论，需人工裁决。
      </div>` : ""}

      ${rows.length === 0 ? `<div class="empty">还没有判例。<b>为什么要有</b>：判例是训练数据来源，也是"这张为什么这么判"的证据。</div>` : `
      <table><caption class="sr-only">判例列表</caption>
        <thead><tr>
          <th scope="col"><input type="checkbox" id="chkAll" aria-label="全选当前页"></th>
          <th scope="col">图</th><th scope="col">#</th><th scope="col">编码</th><th scope="col">件号</th><th scope="col">批次</th><th scope="col">结论</th>
          <th scope="col">理由</th><th scope="col">来源</th><th scope="col">裁决人</th>
          <th scope="col">时间</th><th scope="col">操作</th>
        </tr></thead>
        <tbody>${rows.map(c => `<tr>
          <td><input type="checkbox" class="case-chk" value="${c.id}" ${selectedCases.has(c.id) ? "checked" : ""}></td>
          <td><img class="thumb" src="/api/cases/${c.id}/image" alt="判例 ${c.id}" loading="lazy"
                onerror="this.style.visibility='hidden'"></td>
          <td>${c.id}</td>
          <td>${esc(c.code)}</td>
          <td>${esc(c.part_no || "-")}</td>
          <td>${esc(c.batch_no || "-")}</td>
          <td>${tag(c.verdict)}${c.conflict ? ' <span class="tag ng">冲突</span>' : ""}</td>
          <td>${esc(c.reason || "-")}</td>
          <td class="muted">${esc(c.source || "manual")}</td>
          <td>${esc(c.adjudicator)}</td>
          <td class="muted">${fmtTime(c.created_at)}</td>
          <td>${c.archived_at
            ? `<button class="ghost" data-restore-case="${c.id}">取消归档</button>`
            : `<button class="ghost" data-archive-case="${c.id}">归档</button>`}</td>
        </tr>`).join("")}</tbody></table>
      <div class="row" style="margin-top:12px;align-items:center">
        <button class="ghost" id="casePrev" ${caseState.page === 0 ? "disabled" : ""}>上一页</button>
        <span class="muted" style="flex:1;text-align:center">第 ${caseState.page + 1} / ${pages} 页 · 共 ${total} 条</span>
        <button class="ghost" id="caseNext" ${caseState.page + 1 >= pages ? "disabled" : ""}>下一页</button>
      </div>`}
    </section>`;

  $("newCase").onclick = () => $("caseDlg").showModal();
  $("btnExport").onclick = exportCsv;

  const syncAdd = () => {
    $("btnAddDataset").disabled = selectedCases.size === 0;
    $("btnAddDataset").textContent = `加入数据集（${selectedCases.size}）`;
  };
  document.querySelectorAll(".case-chk").forEach(chk => {
    chk.onchange = () => {
      chk.checked ? selectedCases.add(Number(chk.value)) : selectedCases.delete(Number(chk.value));
      syncAdd();
    };
  });
  $("chkAll").onchange = (e) => {
    document.querySelectorAll(".case-chk").forEach(chk => {
      chk.checked = e.target.checked;
      e.target.checked ? selectedCases.add(Number(chk.value)) : selectedCases.delete(Number(chk.value));
    });
    syncAdd();
  };
  syncAdd();

  $("btnAddDataset").onclick = async () => {
    const [datasets, models] = await Promise.all([api("/api/datasets"), api("/api/models")]);
    const drafts = datasets.filter(d => d.status === "draft");
    $("dsPickList").innerHTML = drafts.length
      ? drafts.map(d => `<option value="${d.id}">#${d.id} ${esc(d.name)} · ${esc(d.model_code)} · ${d.count} 条</option>`).join("")
      : '<option value="">没有草稿数据集，请在下方新建</option>';
    $("dsPickModel").innerHTML = models.map(m => `<option value="${m.id}">${esc(m.code)}</option>`).join("");
    $("dsPickCount").textContent = selectedCases.size;
    $("dsPickDlg").showModal();
  };
  document.querySelectorAll("[data-archive-case]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("归档后该判例不参与训练，可随时恢复。")) return;
      try { await post(`/api/cases/${btn.dataset.archiveCase}/archive`, {}); toast("已归档"); renderCases(); }
      catch (e) { toast(e.message, true); }
    };
  });
  document.querySelectorAll("[data-restore-case]").forEach(btn => {
    btn.onclick = async () => {
      try { await post(`/api/cases/${btn.dataset.restoreCase}/restore`, {}); toast("已恢复"); renderCases(); }
      catch (e) { toast(e.message, true); }
    };
  });

  $("cq_code").onchange = (e) => { caseState.code = e.target.value; renderCases(); };
  $("cq_verdict").onchange = (e) => { caseState.verdict = e.target.value; renderCases(); };
  $("cq_source").onchange = (e) => { caseState.source = e.target.value; renderCases(); };
  $("cq_arch").onchange = (e) => { caseState.showArchived = e.target.value === "1"; renderCases(); };
  $("cq_part").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    caseState.partNo = e.target.value.trim();
    caseState.page = 0;
    renderCases();
  });
  $("cq_batch").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    caseState.batchNo = e.target.value.trim();
    caseState.page = 0;
    renderCases();
  });
  if ($("casePrev")) $("casePrev").onclick = () => { caseState.page = Math.max(0, caseState.page - 1); renderCases(); };
  if ($("caseNext")) $("caseNext").onclick = () => { caseState.page += 1; renderCases(); };
}

  succeeded: "成功", failed: "失败", running: "运行中", queued: "排队中", cancelled: "已取消"
};

            <a class="ghost" href="/api/datasets/${d.id}/export.csv">导出</a>
            ${d.status === "frozen" ? `<button class="ghost" data-audit="${d.id}">核对</button>` : ""}

        <div><button class="act" id="btnCreateDataset">建数据集</button></div>
      </div>
    </section>`;

  $("btnNewDataset").onclick = () => $("ds_name").focus();
  $("btnCreateDataset").onclick = async () => {
    try {
      const r = await post("/api/datasets", {model_id: Number($("ds_model").value), name: $("ds_name").value.trim()});
      toast("数据集已创建，去判例库勾选加入");
      renderDatasets();
    } catch (e) { toast(e.message, true); }
  };
  document.querySelectorAll("[data-audit]").forEach(btn => {
    btn.onclick = async () => {
      try {
        const a = await api(`/api/datasets/${btn.dataset.audit}/audit`);
        const rows = [];
        a.verdict_changed.forEach(x => rows.push(`<tr><td>${x.case_id}</td><td>改判</td><td>${esc(x.before)} → ${esc(x.after)}</td></tr>`));
        a.image_changed.forEach(x => rows.push(`<tr><td>${x.case_id}</td><td>图片变化</td><td>sha256 不一致</td></tr>`));
        a.archived.forEach(x => rows.push(`<tr><td>${x.case_id}</td><td>已归档</td><td>不再参与训练</td></tr>`));
        a.missing.forEach(x => rows.push(`<tr><td>${x.case_id}</td><td>已删除</td><td>判例不存在</td></tr>`));
        $("auditBody").innerHTML = rows.length
          ? rows.join("")
          : `<tr><td colspan="3" class="empty">未发现变化${a.no_snapshot ? "（但该数据集有 " + a.no_snapshot + " 条没有快照，无法核对）" : ""}</td></tr>`;
        $("auditTitle").textContent = `数据集 #${a.dataset_id} 核对 · ${a.clean ? "干净" : "有变化"}`;
        $("auditDlg").showModal();
      } catch (e) { toast(e.message, true); }
    };
  });

  document.querySelectorAll("[data-freeze]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("冻结后成员不可再改，确认？")) return;
      try {
        const r = await post(`/api/datasets/${btn.dataset.freeze}/freeze`, {});
        toast("已冻结 · " + r.checksum.slice(0, 12) + "…");
        renderDatasets();
      } catch (e) { toast(e.message, true); }
    };
  });
}

async function renderBlindBatch(id) {
  const b = await api(`/api/blind/batches/${id}`);
  const isOpen = b.status === "open";
  const pending = b.items.filter(i => !i.human_label);
  const cur = pending[0] || null;

  const metrics = b.metrics ? `
    <div class="cards">
      <div class="card"><span>人判 NG</span><b>${b.metrics.human_ng}</b></div>
      <div class="card"><span>漏检</span><b>${b.metrics.missed}</b></div>
      <div class="card"><span>召回</span><b>${b.metrics.recall != null ? (b.metrics.recall*100).toFixed(1)+"%" : "-"}</b></div>
      <div class="card bad"><span>过杀</span><b>${b.metrics.overkill}</b></div>
      <div class="card"><span>过杀率</span><b>${b.metrics.overkill_rate != null ? (b.metrics.overkill_rate*100).toFixed(1)+"%" : "-"}</b></div>
      <div class="card warn"><span>灰区率</span><b>${(b.metrics.gray_rate*100).toFixed(1)}%</b></div>
    </div>
    ${b.metrics.low_confidence ? '<p class="muted" style="color:var(--warn)">人判 NG 少于门槛，本次为低置信关批。</p>' : ""}` : "";

  $("view").innerHTML = `
    <section>
      <h2>${esc(b.week)} <span class="pill">${b.judged} / ${b.total}</span>
        <span class="pill">${isOpen ? "进行中" : "已关批"}</span></h2>
      ${metrics}
      ${!isOpen ? `<p class="muted" style="margin:10px 0 0">签字：质量 ${esc(b.signed_quality || "-")} · 产线 ${esc(b.signed_line || "-")} · 技术 ${esc(b.signed_tech || "-")} · ${fmtTime(b.signed_at)}</p>` : ""}
    </section>

    ${isOpen ? `
    <section class="review">
      <div class="review-list">
        <h2>待判 <span class="pill">${pending.length}</span></h2>
        <div class="muted">盲判中：不显示系统结论。快捷键 O=OK · N=NG · G=灰区</div>
      </div>
      <div class="review-detail">
        ${cur ? `
          <div class="shot"><img id="blindShot" src="${cur.image_url}" alt="抽样 ${cur.id}"></div>
          <div class="kv">
            <div>件号</div><div>${esc(cur.part_no || "-")}</div>
            <div>进度</div><div>${b.judged} / ${b.total}</div>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="act" id="jOk">OK</button>
            <button class="ghost" id="jGray">灰区</button>
            <button class="ghost" id="jNg">NG</button>
          </div>` : `
          <div class="empty">全部判完，可以关批（需三方签字）。</div>
          <div class="form" style="grid-template-columns:1fr 1fr 1fr;margin-top:12px">
            <div><label for="signQ">质量签字</label><input id="signQ" placeholder="姓名"></div>
            <div><label for="signL">产线签字</label><input id="signL" placeholder="姓名"></div>
            <div><label for="signT">技术签字</label><input id="signT" placeholder="姓名"></div>
          </div>
          <div class="row" style="margin-top:12px">
            <button class="act" id="btnClose">关批并冻结指标</button>
          </div>`}
      </div>
    </section>` : `
    <section>
      <h2>逐件对照（关批后揭盲）</h2>
      <table><caption class="sr-only">抽样明细</caption>
        <thead><tr><th scope="col">#</th><th scope="col">件号</th><th scope="col">人判</th><th scope="col">系统</th></tr></thead>
        <tbody>${b.items.map(i => `<tr><td>${i.id}</td><td>${esc(i.part_no || "-")}</td>
          <td>${tag(i.human_label)}</td><td>${tag(i.system_label)}</td></tr>`).join("")}</tbody></table>
    </section>`}
  `;

  if (!isOpen) return;

  async function judge(label) {
    if (!cur) return;
    await post(`/api/blind/items/${cur.id}/judge`, {human_label: label, judge: "admin"});
    renderBlindBatch(id);
  }
  if (cur) {
    $("jOk").onclick = () => judge("ok");
    $("jGray").onclick = () => judge("gray");
    $("jNg").onclick = () => judge("ng");
    window.__blindKeys = (ev) => {
      const k = ev.key.toLowerCase();
      if (k === "o") $("jOk").click();
      else if (k === "n") $("jNg").click();
      else if (k === "g") $("jGray").click();
    };
  } else {
    $("btnClose").onclick = async () => {
      try {
        const r = await post(`/api/blind/batches/${id}/close`, {
          signed_quality: $("signQ").value.trim(),
          signed_line: $("signL").value.trim(),
          signed_tech: $("signT").value.trim(),
          force: false
        });
        toast("已关批，指标已冻结");
        renderBlindBatch(id);
      } catch (e) {
        if (e.body?.error_code === "low_ng" &&
            confirm(e.message + "\n\n仍要以低置信关批？")) {
          await post(`/api/blind/batches/${id}/close`, {
            signed_quality: $("signQ").value.trim(),
            signed_line: $("signL").value.trim(),
            signed_tech: $("signT").value.trim(),
            force: true
          });
          toast("已低置信关批");
          renderBlindBatch(id);
        } else {
          toast(e.message, true);
        }
      }
    };
  }
}

async function renderTraining() {
  const [jobs, models, datasets] = await Promise.all([api("/api/train"), api("/api/models"), api("/api/datasets")]);
  const frozen = datasets.filter(d => d.status === "frozen");

  $("view").innerHTML = `
    <section>
      <h2>训练新版本</h2>
      <div class="form">
        <div><label for="tr_model">模型</label>
          <select id="tr_model">${models.map(m => `<option value="${m.id}">${esc(m.code)} ${esc(m.name || "")}</option>`).join("")}</select>
        </div>
        <div><label for="tr_dataset">数据集（已冻结）</label>
          <select id="tr_dataset">${frozen.map(d => `<option value="${d.id}" data-model="${d.model_id}">#${d.id} ${esc(d.name)} · ${esc(d.model_code)} · ${d.count} 条</option>`).join("")}</select>
        </div>
        <div><button class="act" id="btnTrain">开始训练</button></div>
      </div>
      ${frozen.length === 0 ? '<p class="muted">还没有已冻结的数据集：先去「数据集」建一个并冻结。</p>' : ""}
      <p class="muted">当前是假训练器：只验证状态机与发布链路，指标为模拟值，不代表模型能力。</p>
    </section>

    <section>
      <h2>训练任务 <span class="pill">${jobs.length}</span></h2>
      ${jobs.length === 0 ? `<div class="empty">还没有训练任务。<b>下一步</b>：在上方选一个模型开始第一次训练。</div>` : `
      <table><caption class="sr-only">训练任务</caption>
        <thead><tr><th scope="col">#</th><th scope="col">模型</th><th scope="col">数据集</th><th scope="col">状态</th><th scope="col">召回</th><th scope="col">过杀</th><th scope="col">样本</th><th scope="col">完成时间</th></tr></thead>
        <tbody>${jobs.map(j => `<tr>
          <td>${j.id}</td><td>${esc(j.model_code)}</td>
          <td><span class="tag ${j.status === "succeeded" ? "ok" : j.status === "failed" ? "ng" : "gray"}">${esc(stLabel(j.status))}</span></td>
          <td>${j.metrics ? (j.metrics.recall * 100).toFixed(1) + "%" : "-"}</td>
          <td>${j.metrics ? (j.metrics.overkill * 100).toFixed(1) + "%" : "-"}</td>
          <td>${j.metrics ? j.metrics.train_samples : "-"}</td>
          <td class="muted">${fmtTime(j.finished_at)}</td>
        </tr>`).join("")}</tbody></table>`}
    </section>

    <section>
      <h2>版本与发布</h2>
      ${models.length === 0 ? `<div class="empty">还没有模型。</div>` : models.map(m => `
        <div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <b>${esc(m.code)}</b><span class="muted">${esc(m.name || "")}</span>
            <span style="margin-left:auto">
              <button class="ghost" data-rollback="${m.id}">回滚到上一版</button>
            </span>
          </div>
          ${m.versions.length === 0 ? '<div class="muted">还没有版本</div>' : `
          <table><caption class="sr-only">${esc(m.code)} 的版本</caption>
            <thead><tr><th scope="col">版本</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead>
            <tbody>${m.versions.map(v => `<tr>
              <td>v${v.version_no}</td>
              <td><span class="tag ${v.status}">${esc(stLabel(v.status))}</span></td>
              <td>${v.status === "candidate"
                ? `<button class="act" data-publish="${m.id}:${v.version_no}">发布为生效</button>`
                : v.status === "assist" ? '<span class="muted">当前生效</span>'
                : v.status === "disabled" ? `<button class="ghost" data-revive="${m.id}:${v.version_no}">重新启用</button>`
                : ""}</td>
            </tr>`).join("")}</tbody></table>`}
        </div>`).join("")}
    </section>`;

  $("btnTrain").onclick = async () => {
    try {
      const dsId = Number($("tr_dataset").value);
      if (!dsId) { toast("先选择一个已冻结的数据集", true); return; }
      const ds = frozen.find(d => d.id === dsId);
      const r = await post("/api/train", {model_id: ds.model_id, dataset_id: dsId});
      toast(`已训练出 v${r.version_no}，指标见列表`);
      renderTraining();
    } catch (e) { toast(e.message, true); }
  };
  document.querySelectorAll("[data-publish]").forEach(btn => {
    btn.onclick = async () => {
      const [mid, vno] = btn.dataset.publish.split(":");
      if (!confirm(`发布 ${btn.dataset.name} v${vno}？\n\n验证期进入"生效"后，该模型下所有编码立即使用新版本；旧版本降为已停用。`)) return;
      try {
        await api(`/api/models/${mid}/versions/${vno}/status`, {
          method: "PUT", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({status: "assist"})
        });
        toast(`v${vno} 已发布，旧版本自动降为 disabled`); renderTraining();
      } catch (e) { toast(e.message, true); }
    };
  });
  document.querySelectorAll("[data-revive]").forEach(btn => {
    btn.onclick = async () => {
      const [mid, vno] = btn.dataset.revive.split(":");
      try {
        await api(`/api/models/${mid}/versions/${vno}/status`, {
          method: "PUT", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({status: "assist"})
        });
        toast(`v${vno} 重新启用`); renderTraining();
      } catch (e) { toast(e.message, true); }
    };
  });
  document.querySelectorAll("[data-rollback]").forEach(btn => {
    btn.onclick = async () => {
      const mid = Number(btn.dataset.rollback);
      const m = models.find(x => x.id === mid);
      const cur = m && m.versions.find(v => v.status === "assist");
      const prev = m && m.versions.filter(v => v.status === "disabled" && cur && v.version_no < cur.version_no)
        .sort((a, b) => b.version_no - a.version_no)[0];
      if (!cur || !prev) { toast("没有可回退的版本", true); return; }
      if (!confirm(`回滚：v${cur.version_no} → v${prev.version_no}？\n当前版本会降为已停用。`)) return;
      try {
        const r = await post(`/api/models/${mid}/rollback`, {});
        toast(`已回滚 v${r.from} → v${r.to}`); renderTraining();
      } catch (e) { toast(e.message, true); }
    };
  });
}

function renderPlaceholder(title, need, items) {
  $("view").innerHTML = `
    <section>
      <h2>${esc(title)}</h2>
      <div class="empty">
        这一页需要先补后端：<b>${esc(need)}</b>
        <ul style="margin:10px 0 0 18px;line-height:2">${items.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
    </section>`;
}

/* ---------- 路由 ---------- */

const TITLES = {
  workbench: "工作台", wizard: "新建向导", catalog: "编码与模型", quality: "复核队列", cases: "判例库",
  datasets: "数据集", blind: "抽检", training: "训练与发布", system: "系统", settings: "设置"
};

async function route() {
  const raw = (location.hash.replace(/^#\/?/, "") || "workbench").split("?")[0];
  const [name, arg] = raw.split("/");
  document.querySelectorAll("[data-nav]").forEach(a => {
    const on = a.dataset.nav === (name === "code" ? "catalog" : name);
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  $("title").textContent = name === "code" ? "编码详情" : (TITLES[name] || "工作台");
  try {
    if (name === "code" && arg) return await renderCode(decodeURIComponent(arg));
    if (name === "wizard") return await renderWizard();
    if (name === "catalog") return await renderCatalog();
    if (name === "quality") return await renderQuality();
    if (name === "cases") return await renderCases();
    if (name === "datasets") return await renderDatasets();
    if (name === "blind" && arg) return await renderBlindBatch(Number(arg));
    if (name === "blind") return await renderBlind();
    if (name === "training") return await renderTraining();
    if (name === "system") return await renderSystem();
    if (name === "settings") return await renderSettings();
    return await renderWorkbench();
  } catch (e) {
    $("view").innerHTML = `<section><div class="empty">加载失败：${esc(e.message)}<br><b>下一步</b>：${esc(e.body?.action || "刷新页面重试；仍失败请检查服务是否在跑")}</div></section>`;
  }
}

async function health() {
  try {
    const h = await api("/health");
    $("health").textContent = `服务 ${h.status} · 队列 ${h.queue_depth}`;
  } catch { $("health").textContent = "服务不可用"; }
}

$("jump").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") {
    const v = ev.target.value.trim();
    if (!v) return;
    location.hash = "#/code/" + encodeURIComponent(v);
  }
});

window.addEventListener("hashchange", route);

$("caseForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (ev.submitter && ev.submitter.value === "cancel") return;
  try {
    let cropPath = $("f_path").value.trim();
    const file = $("f_file").files[0];
    if (file) {
      const form = new FormData();
      form.append("file", file);
      const up = await api("/api/cases/upload", {method: "POST", body: form});
      cropPath = up.crop_path;
    }
    if (!cropPath) { toast("请上传裁片或填写路径", true); return; }
    await post("/api/cases", {
      code: $("f_code").value.trim(),
      crop_path: cropPath,
      verdict: $("f_verdict").value,
      adjudicator: $("f_adj").value.trim(),
      reason: $("f_reason").value || null,
      source: $("f_source").value,
      part_no: $("f_part").value.trim() || null
    });
    $("caseDlg").close();
    $("caseForm").reset();
    selectedCases.clear();
    toast("判例已入库");
    renderCases();
  } catch (e) { toast(e.message, true); }
});

$("dsPickForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (ev.submitter && ev.submitter.value === "cancel") return;
  try {
    let dsId = Number($("dsPickList").value);
    if (!dsId) {
      const name = $("dsPickName").value.trim();
      if (!name) { toast("新数据集需要一个名称", true); return; }
      const created = await post("/api/datasets", {model_id: Number($("dsPickModel").value), name});
      dsId = created.id;
    }
    const r = await post(`/api/datasets/${dsId}/items`, {case_ids: [...selectedCases]});
    $("dsPickDlg").close();
    selectedCases.clear();
    toast(`已加入 ${r.added.length} 条，跳过 ${r.skipped.length} 条`);
    renderCases();
  } catch (e) { toast(e.message, true); }
});

document.addEventListener("keydown", (ev) => {
  const tagName = (ev.target.tagName || "").toLowerCase();
  if (tagName === "input" || tagName === "select" || tagName === "textarea") return;
  if (location.hash.startsWith("#/quality") && window.__reviewKeys) window.__reviewKeys(ev);
  if (location.hash.startsWith("#/blind/") && window.__blindKeys) window.__blindKeys(ev);
});
health(); route();
setInterval(health, 20000);
</script>
