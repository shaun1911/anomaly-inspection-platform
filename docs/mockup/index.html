<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIP · 工业异常检测平台 · 原型 v0.3</title>
<style>
/* ============================================================
   AIP 控制台 · 主题层
   依据《效率工具 App 组件规范》v1（现代汽车工业 · 橙色主题）
   - 主色 #F26522，Tint 阶 / Shade 阶
   - 中性灰 Gray-0 #FFFFFF … Gray-700 #1A1A1A
   - 语义色 Success #34C759 / Warning #F5A623 / Error #FF3B30 / Info #007AFF
   - 字体 24/32 · 20/28 · 17/24 · 15/22 · 13/18 · Data 16/24
   - 4dp 栅格；按钮圆角 8；卡片圆角 12；列表行高 56
   ============================================================ */
:root{
  /* brand */
  --pri:#F26522; --pri-shade:#D5541D; --pri-deep:#B94418; --pri-dark:#993A14;
  --pri-t100:#FFF4EE; --pri-t200:#FFE6D9; --pri-t300:#FFC9B0; --pri-t400:#FF9A6B;
  /* neutral */
  --g0:#FFFFFF; --g50:#FAFAFA; --g100:#F7F7F7; --g200:#EEEEEE; --g300:#E0E0E0;
  --g400:#C6C6C6; --g500:#9E9E9E; --g600:#666666; --g700:#1A1A1A;
  /* semantic */
  --ok:#34C759; --ok-bg:#E8F8EE; --ok-bd:#BFE9CD; --ok-tx:#1B8F45;
  --warn:#F5A623; --warn-bg:#FFF6E5; --warn-bd:#FFE0A3; --warn-tx:#A96B00;
  --ng:#FF3B30; --ng-bg:#FFECEB; --ng-bd:#FFC9C5; --ng-tx:#C62828;
  --info:#007AFF; --info-bg:#E8F2FF; --info-bd:#B9D6FF; --info-tx:#0063CC;

  --bg:var(--g100); --panel:var(--g0); --line:var(--g200); --line2:var(--g300);
  --txt:var(--g700); --mut:var(--g600); --mut2:var(--g500);
  --mono:ui-monospace,"SF Mono",Consolas,"Cascadia Mono",monospace;
  --shadow-1:0 2px 6px rgba(0,0,0,.08);
  --shadow-2:0 4px 14px rgba(0,0,0,.10);
  --r-btn:8px; --r-card:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:15px/22px system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ------------------------------------------------------------ 布局 */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{
  background:var(--panel);border-right:1px solid var(--line);
  padding:18px 12px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--pri),var(--pri-t400));
  color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;
  box-shadow:0 2px 6px rgba(242,101,34,.35);
}
.brand b{font-size:15px;line-height:20px;letter-spacing:.2px}
.brand small{display:block;color:var(--mut2);font-size:11.5px;font-weight:400;margin-top:2px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r-btn);color:var(--mut);
  font-size:14px;line-height:20px;position:relative;transition:background .12s,color .12s;
}
.nav button:hover{background:var(--g50);color:var(--txt)}
.nav button.on{background:var(--pri-t100);color:var(--pri-shade);font-weight:600}
.nav button.on::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--pri);
}
.nav .ico{width:18px;text-align:center;font-size:14px;opacity:.95}

.side .foot{
  margin-top:auto;font-size:11.5px;line-height:1.8;color:var(--mut2);
  padding:12px 8px 4px;border-top:1px solid var(--line);
}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}

.main{padding:20px 28px 48px;max-width:1600px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.top h1{margin:0;font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.2px}
.top .sub{color:var(--mut);font-size:13px;line-height:18px;margin-top:4px}
.badge{
  font-size:12px;line-height:18px;padding:4px 10px;border-radius:999px;
  background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);white-space:nowrap;
}

/* ------------------------------------------------------------ 卡片 */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  padding:16px;box-shadow:var(--shadow-1);
}
.card h3{margin:0 0 12px;font-size:17px;line-height:24px;font-weight:600;color:var(--txt)}
.card h3 span{color:var(--mut2);font-weight:400;font-size:12.5px;margin-left:4px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.4fr 1fr}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}

/* KPI */
.kpi .lab{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .val{font:600 26px/32px var(--mono);margin-top:6px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:13px;color:var(--mut2);font-weight:400;font-family:inherit;margin-left:2px}
.kpi .delta{font-size:12px;margin-top:4px}
.up{color:var(--ok-tx)} .down{color:var(--ng-tx)}

/* ------------------------------------------------------------ 表格 / 列表 */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{
  color:var(--mut);font-weight:500;font-size:12.5px;text-align:left;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--g50);
}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:22px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--g50)}
.tbl tr.sel td{background:var(--pri-t100)}
.tablewrap{overflow:auto;border-radius:var(--r-btn)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------ 标签 */
.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:18px;
  padding:2px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;font-weight:500;
}
.tag.on{background:var(--ok-bg);color:var(--ok-tx);border-color:var(--ok-bd)}
.tag.cand{background:var(--warn-bg);color:var(--warn-tx);border-color:var(--warn-bd)}
.tag.off{background:var(--g100);color:var(--mut);border-color:var(--g300)}
.tag.fail{background:var(--ng-bg);color:var(--ng-tx);border-color:var(--ng-bd)}
.tag.run{background:var(--info-bg);color:var(--info-tx);border-color:var(--info-bd)}

/* ------------------------------------------------------------ 按钮 */
.btn{
  all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:8px 16px;border-radius:var(--r-btn);
  border:1px solid var(--line2);background:var(--panel);color:var(--txt);
  font-size:14px;line-height:20px;font-weight:500;text-align:center;
  transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{border-color:var(--g400);background:var(--g50)}
.btn:active{background:var(--g100)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-shade);border-color:var(--pri-shade)}
.btn.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx)}
.btn.ok:hover{background:#DCF3E5}
.btn.ng{background:var(--ng-bg);border-color:var(--ng-bd);color:var(--ng-tx)}
.btn.ng:hover{background:#FFDFDD}
.btn.sm{min-height:32px;padding:5px 12px;font-size:12.5px;border-radius:7px;font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:var(--panel);border-color:var(--line2)}

/* ------------------------------------------------------------ 进度 / 分隔 */
.bar{height:6px;background:var(--g200);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .35s}
.bar.ok>i{background:var(--ok)}
.sep{height:1px;background:var(--line);margin:16px 0}

/* ------------------------------------------------------------ 工具类 */
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:14px}
.mut{color:var(--mut)} .sm{font-size:13px;line-height:20px} .tiny{font-size:12px;line-height:18px;color:var(--mut)}
.tiny.mut{color:var(--mut2)}
.pill{
  font-family:var(--mono);font-size:11.5px;line-height:18px;
  background:var(--pri-t100);border:1px solid var(--pri-t200);color:var(--pri-deep);
  padding:2px 8px;border-radius:6px;white-space:nowrap;
}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;line-height:20px}
.kv dt{color:var(--mut2)}
.kv dd{margin:0;font-family:var(--mono);font-size:13px}

/* ------------------------------------------------------------ 表单 */
input,select,textarea{
  background:var(--panel);border:1px solid var(--line2);color:var(--txt);
  padding:10px 12px;border-radius:var(--r-btn);font-size:14px;font-family:inherit;min-height:40px;
  transition:border-color .12s,box-shadow .12s;
}
input.mono,select.mono,textarea.mono{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(242,101,34,.14);
}
input:disabled,select:disabled{background:var(--g100);color:var(--mut2);cursor:not-allowed}
textarea{min-height:auto;padding:10px 12px;line-height:20px}
label.sm{display:inline-flex;align-items:center;gap:8px;color:var(--mut)}

/* ------------------------------------------------------------ 上传区 */
.drop{
  border:2px dashed var(--g300);border-radius:var(--r-card);
  padding:28px;text-align:center;color:var(--mut);cursor:pointer;transition:all .15s;background:var(--g50);
}
.drop:hover{border-color:var(--pri);color:var(--pri-deep);background:var(--pri-t100)}

/* ------------------------------------------------------------ 样本网格 */
.sample-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
@media(max-width:1200px){.sample-grid{grid-template-columns:repeat(4,1fr)}}
.sample{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--g100)}
.sample canvas{width:100%;height:100%;display:block}
.sample .lb{
  position:absolute;left:6px;bottom:5px;font-size:10.5px;line-height:16px;
  padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.92);color:var(--g700);
  border:1px solid var(--line);
}
.sample .ng{color:var(--ng-tx);border-color:var(--ng-bd);background:var(--ng-bg)}

/* ------------------------------------------------------------ 判级结论 */
.verdict{font:700 40px/44px var(--mono);letter-spacing:1px}

/* ------------------------------------------------------------ 提示 */
.toast{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast div{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--info);
  padding:12px 16px;border-radius:10px;font-size:13.5px;line-height:20px;
  box-shadow:var(--shadow-2);animation:in .18s ease-out;max-width:380px;
}
.toast div.ok{border-left-color:var(--ok)}
.toast div.warn{border-left-color:var(--warn)}
@keyframes in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ------------------------------------------------------------ 代码块 */
pre{
  margin:0;background:var(--g100);border:1px solid var(--line);border-radius:var(--r-btn);
  padding:14px;font-family:var(--mono);font-size:12px;line-height:19px;color:#333;
  overflow:auto;
}

/* ------------------------------------------------------------ 空状态 */
.empty{text-align:center;color:var(--mut2);padding:48px 0;font-size:13px}
.empty div:first-child{font-size:32px;margin-bottom:10px;opacity:.45}

/* ------------------------------------------------------------ 步骤条 */
.step{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut2)}
.step b{color:var(--txt);font-weight:500}
.step i{
  width:20px;height:20px;border-radius:50%;background:var(--g200);color:var(--mut);
  display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;flex:none;
}

/* ------------------------------------------------------------ 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--g400)}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>

function toast(msg, type=''){

function seedRand(seed){ return ()=> (seed = (seed*9301+49297)%233280)/233280; }
function paintMetal(cv, opt={}){
  const c=cv.getContext('2d'), w=cv.width, h=cv.height, r=seedRand(opt.seed||7);
  const g=c.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#8d9299'); g.addColorStop(.5,'#9aa0a8'); g.addColorStop(1,'#7f858d');
  c.fillStyle=g; c.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){
    const y=r()*h, a=r()*.10, l=40+r()*w;
    c.strokeStyle=`rgba(${r()>.5?255:20},${r()>.5?255:25},${r()>.5?255:30},${a})`;
    c.beginPath(); c.moveTo(r()*w,y); c.lineTo(r()*w+l,y); c.stroke();
  }
  if(opt.defect){
    const x=w*(.35+(opt.seed%5)*.06), y=h*.45;
    if(opt.defect==='scratch'){
      c.strokeStyle='rgba(30,32,36,.85)'; c.lineWidth=Math.max(2,w*.006);
      c.beginPath(); c.moveTo(x-w*.10,y+h*.06); c.lineTo(x+w*.12,y-h*.09); c.stroke();
      const hg=c.createRadialGradient(x,y,2,x,y,w*.16);
      hg.addColorStop(0,'rgba(255,80,60,.55)'); hg.addColorStop(1,'rgba(255,80,60,0)');
      c.fillStyle=hg; c.fillRect(0,0,w,h);
    } else {
      const hg=c.createRadialGradient(x,y,2,x,y,w*.14);
      hg.addColorStop(0,'rgba(255,120,40,.65)'); hg.addColorStop(1,'rgba(255,120,40,0)');
      c.fillStyle=hg; c.fillRect(0,0,w,h);
      c.fillStyle='rgba(40,42,46,.35)'; c.beginPath(); c.ellipse(x,y,w*.05,h*.07,.4,0,7); c.fill();
    }
    if(opt.box){
      const bx=x-w*.12, by=y-h*.12, bw=w*.16, bh=h*.2;
      if(opt.heat){ c.fillStyle='rgba(255,60,60,.10)'; c.fillRect(0,0,w,h); }
      c.strokeStyle='#FF3B30'; c.lineWidth=2; c.strokeRect(bx,by,bw,bh);
      c.fillStyle='#FF3B30'; c.font='11px ui-monospace'; c.fillText('defect 0.87', bx+2, by-4);
    }
  }
}
function sparkline(vals,w=640,h=88){
  const max=Math.max(...vals)*1.08;
  const pts=vals.map((v,i)=>[i*(w/(vals.length-1)), h-(v/max)*(h-8)-4]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M0 ${h} `+pts.map(p=>`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')+` L${w} ${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F26522" stop-opacity=".30"/><stop offset="1" stop-color="#F26522" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g1)"/><path d="${d}" fill="none" stroke="#F26522" stroke-width="1.6"/></svg>`;
}
function histogram(){
  const bins=[3,6,14,28,46,62,74,58,41,27,19,12,8,5], max=Math.max(...bins);
  return bins.map((v,i)=>{
    const color=i>=8?'#FF3B30':(i>=5?'#F5A623':'#34C759');
    return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:74px">
      <i style="display:block;height:${(v/max*100).toFixed(0)}%;background:${color};opacity:.85;border-radius:2px 2px 0 0"></i></div>`;
  }).join('');
}
function stateTag(s){
  return s==='ready'?'<span class="tag on">● 已加载</span>'
    : s==='loading'?'<span class="tag run">加载中</span>'
    : s==='failed'?'<span class="tag fail">失败</span>'
    : '<span class="tag off">未加载</span>';
}

function resolveCard(p){
  if(!p) return '<div class="tag fail">422 未知编码</div><div class="tiny mut" style="margin-top:8px">未找到该编码。不会回退默认模型（错判比不判更危险）。</div>';
  const ok=p.state==='ready', mid=p.model;
  return `
    <div class="between"><div><div style="font-size:15px"><b>${p.name}</b></div><div class="tiny mut mono">${p.code}</div></div>
      <span class="tag ${ok?'on':p.state==='failed'?'fail':'cand'}">${ok?'● 已加载':'需预热'}</span></div>
    <div class="kv" style="margin-top:12px">
      <dt>产品族</dt><dd>${p.family}</dd><dt>零件</dt><dd>${p.part}</dd><dt>序号</dt><dd>${p.seq}</dd>
      <dt>绑定模型</dt><dd>${mid}</dd><dt>当前生效版本</dt><dd>${activeVer(mid)}</dd><dt>state</dt><dd>${p.state}</dd>
      <dt>预估加载</dt><dd>${ok?'0 ms':'~720 ms（wrn50）'}</dd></div>
    ${ok?'':`<div class="row" style="margin-top:12px"><button class="btn sm pri" onclick="preloadOne('${p.code}')">立即预热</button>
      <span class="tiny mut">或直接推图：服务端同步加载，最多 2 s</span></div>`}`;
}

function viewRouting(){
  const loaded=S.products.filter(p=>p.state==='ready');
  const groups={};
  loaded.forEach(p=>{ const key=p.model; groups[key]=groups[key]||{n:0,vram:p.vram}; groups[key].n++; });
  const totalVram=loaded.reduce((a,p)=>a+p.vram,0);
  const current=S.products.find(x=>x.code===S.resolve.code);
  const q=(S.bindSearch||'').trim().toLowerCase();
  const rows=S.products.filter(p=>{
    if(S.bindFilter==='bound' && !p.model) return false;
    if(S.bindFilter==='unbound' && p.model) return false;
    if(S.bindFilter==='retired' && p.active!==false) return false;
    if(q && !(p.code.toLowerCase().includes(q) || (p.name||'').toLowerCase().includes(q))) return false;
    return true;
  });
  return `
  <div class="grid g2">
    <div class="card"><h3>编码解析 <span>· GET /routing/resolve</span></h3>
      <div class="row"><input id="codeInput" class="mono" value="${S.resolve.code}" style="flex:1">
        <button class="btn pri" onclick="resolveCode()">解析</button></div>
      <div id="resolveBox" style="margin-top:14px">${resolveCard(current)}</div>
      <div class="sep"></div>
      <div class="tiny mut">完整编码精确匹配；未命中直接 <b>422</b>，绝不回退默认模型。换型前先调这个接口，确认 <span class="mono">state=ready</span> 再投料。</div></div>

    <div class="card"><h3>常驻模型 <span>· GET /routing/loaded</span></h3>
      <div class="kv" style="margin-bottom:12px"><dt>常驻模型</dt><dd>${Object.keys(groups).length} 个</dd>
        <dt>显存占用</dt><dd>${totalVram} MB / 32256 MB</dd><dt>建议上限</dt><dd>24 个（LRU 兜底）</dd></div>
      <div class="tablewrap"><table class="tbl">
        <thead><tr><th>模型</th><th>绑定产品</th><th>生效版本</th><th>显存</th></tr></thead>
        <tbody>${Object.entries(groups).map(([mid,g])=>`<tr><td class="mono">${mid}</td><td>${g.n} 个</td>
          <td class="mono">${activeVer(mid)}</td><td class="mono">${g.vram} MB</td></tr>`).join('')||'<tr><td colspan="4" class="mut">尚无常驻模型</td></tr>'}</tbody>
      </table></div>
      <div class="tiny mut" style="margin-top:10px">wrn50 单模型 122 MB（40 张库）；32 GB 可放 200+，LRU 只是保险丝。</div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="between">
      <h3 style="margin:0">编码 → 模型 <span>· 多对一 · 编码不可改</span></h3>
      <button class="btn sm pri" onclick="openBind('create')">+ 新建绑定</button>
    </div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap">
      <input id="bindSearch" value="${S.bindSearch}" placeholder="搜索编码或描述" style="width:220px" oninput="bindSearch(this.value)">
      ${[['all','全部'],['bound','已绑定'],['unbound','未绑定'],['retired','已停用']].map(([k,l])=>
        `<button class="btn sm ${S.bindFilter===k?'pri':''}" onclick="bindFilter('${k}')">${l}</button>`).join('')}
      <span class="tiny mut">共 ${rows.length} 条</span>
    </div>
    <div class="tablewrap" style="margin-top:12px"><table class="tbl">
      <thead><tr><th>编码</th><th>描述</th><th>绑定模型</th><th>状态</th><th>最近变更</th><th style="width:230px">操作</th></tr></thead>
      <tbody>${rows.map(x=>`<tr style="${x.active===false?'opacity:.55':''}">
        <td class="mono">${x.code}</td><td>${x.name}</td>
        <td class="mono">${x.model||'<span class="mut">未绑定</span>'}</td>
        <td>${x.active===false?'<span class="tag off">已停用</span>':x.model?'<span class="tag on">启用</span>':'<span class="tag cand">未绑定</span>'}</td>
        <td class="tiny mut">${x.at||'11-10 16:20'}</td>
        <td><div class="row" style="gap:4px">
          <button class="btn sm" onclick="openBind('edit','${x.code}')">编辑</button>
          <button class="btn sm" onclick="toggleActive('${x.code}')">${x.active===false?'启用':'停用'}</button>
          <button class="btn sm ng" onclick="deleteBind('${x.code}')">删除</button>
        </div></td></tr>`).join('')}</tbody>
    </table></div>
    ${rows.length?'':'<div class="empty"><div>∅</div><div>没有匹配的绑定</div></div>'}
    <div class="tiny mut" style="margin-top:10px">编码是现场助记符：一个模型可绑多个编码；编码创建后<b>不可改</b>——要换编码请「停用旧码 + 新建新码」。已有检测记录的编码不能删除，只能停用（保留历史）。</div>
  </div>

function viewReview(){
  const all=S.pool.filter(p=>!p.verdict);
  const byModel={};
  all.forEach(p=>byModel[p.model]=(byModel[p.model]||0)+1);
  const list=S.pool.filter(p=>!p.verdict && (S.reviewFilter==='all'||p.model===S.reviewFilter));
  const cur=list[0];
  const used=Math.floor(S.budget.used/60), usedS=S.budget.used%60;
  const quota={'M-BR-01':24,'M-BL-01':10,'M-CP-01':4,'M-WS-01':2};
  const st=cur?(S.reviewStats[cur.model]||{ok:0,ng:0}):{ok:0,ng:0};
  return `
  <div class="card">
    <div class="between"><h3 style="margin:0">今日复核 <span>· 预算 ${S.budget.minutes} 分钟 · 按模型分组</span></h3>
      <div class="tiny mut">已用 ${used}:${String(usedS).padStart(2,'0')} · 待复核 ${all.length} 张</div></div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
      <button class="btn sm ${S.reviewFilter==='all'?'pri':''}" onclick="setFilter('all')">全部 ${all.length}</button>
      ${Object.entries(byModel).map(([mid,n])=>`<button class="btn sm ${S.reviewFilter===mid?'pri':''}" onclick="setFilter('${mid}')">${mid} <span class="mut">${n}</span></button>`).join('')}
    </div>
    <div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,S.budget.used/(S.budget.minutes*60)*100)}%"></i></div>
    <div class="tiny mut" style="margin-top:6px">配额按模型分配；当前筛选：<b>${S.reviewFilter==='all'?'全部模型':S.reviewFilter}</b>。确认后样本只并入<b>该模型</b>的数据集。</div>
  </div>

  <div class="card" style="margin-top:14px">${cur?`
    <div class="grid g2">
      <div><canvas id="rcv" width="760" height="470" style="width:100%;border-radius:10px;border:1px solid var(--line)"></canvas></div>
      <div>
        <div class="between">
          <div><div class="sm"><b>${modelName(cur.model)}</b> <span class="mono tiny mut">${cur.model}</span></div>
            <div class="tiny mut mono">${cur.product} · 生效 ${activeVer(cur.model)} · low_conf</div></div>
          <span class="mono">score ${cur.score.toFixed(2)}</span>
        </div>
        <div class="bar" style="margin:10px 0 6px"><i style="width:${cur.score*100}%"></i></div>
        <div class="between tiny mut"><span>0.0</span><span>该模型阈值 0.50</span><span>1.0</span></div>
        <div class="sep"></div>
        <div class="kv">
          <dt>该模型今日</dt><dd>确认 OK ${st.ok} / NG ${st.ng}</dd>
          <dt>确认后去向</dt><dd>${cur.model} 的 normal 集（OK）或验收集（NG）</dd>
          <dt>该模型待复核</dt><dd>${byModel[cur.model]||0} 张（今日配额 ${quota[cur.model]||'—'}）</dd>
        </div>
        <div class="sep"></div>
        <div class="row" style="flex-wrap:wrap">
          <button class="btn ok" onclick="review(1)">1 · 实际 OK（过杀）</button>
          <button class="btn ng" onclick="review(0)">2 · 实际 NG</button>
          <button class="btn" onclick="review(-1)">空格 · 跳过</button></div>
        <div class="tiny mut" style="margin-top:12px">快捷键 1 / 2 / 空格；点上方 chip 切换模型，避免在 4 个模型之间来回跳。</div>
      </div>
    </div>`:`<div class="empty"><div>✓</div>
      <div>${S.reviewFilter==='all'?'今天没有待复核样本':'该模型队列已清空'}</div>
      <div class="tiny" style="margin-top:6px">${S.reviewFilter==='all'?'队列清空后，飞轮会在 02:00 自动训练':'可切回「全部」查看其它模型'}</div></div>`}
  </div>

  <div class="card" style="margin-top:14px"><h3>各模型复核情况 <span>· 配额与今日确认</span></h3>
    <div class="tablewrap"><table class="tbl">
      <thead><tr><th>模型</th><th>生效版本</th><th>待复核</th><th>今日配额</th><th>已确认 OK</th><th>已确认 NG</th><th>实测过杀</th><th></th></tr></thead>
      <tbody>${S.models.map(m=>{const a=m.versions.find(v=>v.status==='active');const s=S.reviewStats[m.id]||{ok:0,ng:0};
        const done=s.ok+s.ng, q=quota[m.id]||0;
        return `<tr><td class="mono">${m.id}<div class="tiny mut">${m.name}</div></td>
          <td class="mono">${a.v}</td><td class="mono">${byModel[m.id]||0}</td>
          <td class="mono ${done>q?'':''}" style="${done>q?'color:var(--warn)':''}">${done} / ${q}</td>
          <td class="mono">${s.ok}</td><td class="mono">${s.ng}</td><td class="mono">${a.overkill}%</td>
          <td><button class="btn sm" onclick="setFilter('${m.id}')">只复核它</button></td></tr>`}).join('')}</tbody>
    </table></div>
    <div class="tiny mut" style="margin-top:10px">超配额只记录不阻塞：单个模型不能把 10 分钟预算占满，否则其它模型的阈值会长期失准。</div>
  </div>`;
}

const WIZ_STEPS=['基本信息','绑定产品','训练数据','训练配置','确认创建'];
function wizIssues(){
  const w=S.wizard, block=[], warn=[];
  if(w.step===1){
    if(!w.name.trim()) block.push('填写模型名称');
    else if(S.models.some(m=>m.name===w.name.trim())) block.push('模型名称已存在');
  }
  if(w.step===2){
    if(!w.products.length) block.push('至少选择一个产品编码');
    const taken=w.products.filter(c=>(S.products.find(p=>p.code===c)||{}).model);
    if(taken.length) block.push('已被占用：'+taken.join('、'));
  }
  if(w.step===3){
    if(w.trainCount<=0) block.push('正常品至少 1 张');
    if(w.trainCount>0 && w.trainCount<50) warn.push('正常品少于 50 张，召回可能不稳');
    if(w.defectCount===0) warn.push('没有缺陷图：只能评估图像级指标，pixel-F1 不可信');
  }
  if(w.step===5 && !w.smoke) warn.push('跳过冒烟集：错绑风险由你承担');
  return {block,warn};
}

/* ------------------------------ 通用实体弹窗（CRUD 复用） ------------------------------ */
function pathSet(key, v){
  const p=S.paths.find(x=>x.key===key);
  if(p) p.path=v;
}
function savePaths(){
  const bad=S.paths.filter(p=>p.editable && !/^[A-Za-z]:\\/.test(p.path.trim()));
  if(bad.length){ toast('必须是绝对路径：'+bad.map(b=>b.name).join('、'),'warn'); return; }
  toast('路径已保存，重启 AIP-Web 与 AIP-Worker 后生效','ok');
}
function samplingSet(k,v){ S.sampling[k]=v; render(); }
function samplingCap(k,v){ S.sampling.caps[k]=v; render(); }
function samplingModelCap(mid,k,v){
  const o=S.samplingModelCaps[mid]||(S.samplingModelCaps[mid]={});
  if(v===''||v===null||v===undefined){ delete o[k]; } else { o[k]=+v; }
  render();
}
function validateSampling(){
  const c=S.sampling, errs=[];
  if(!/^\d{1,2}:\d{2}$/.test(String(c.time))) errs.push('抽选时间格式应为 HH:MM');
  const sum=Object.values(c.caps).reduce((a,b)=>a+(+b||0),0);
  if(sum>c.dailyCap) errs.push('各分层上限之和 '+sum+' 超过每日上限 '+c.dailyCap);
  const humanCap=Math.floor(c.budgetMin*60/6);
  if(c.caps.low>humanCap) errs.push('低置信上限 '+c.caps.low+' 超过人工预算可处理 '+humanCap+' 张');
  if(!(c.highOkMax<c.lowRange[0] && c.lowRange[0]<=c.lowRange[1] && c.lowRange[1]<c.highNgMin))
    errs.push('分层区间重叠或倒置');
  return errs;
}
function saveSampling(){
  const errs=validateSampling();
  if(errs.length){ toast('校验未通过：'+errs[0],'warn'); return; }
  toast('抽样配置已保存，次日 '+S.sampling.time+' 生效','ok');
}
function resetSampling(){
  S.sampling=JSON.parse(JSON.stringify(DEFAULT_SAMPLING));
  S.samplingModelCaps={};
  toast('已恢复默认配置','warn'); render();
}
function openModal(type, id){
  const editing=!!id;
  const m={type, mode:editing?'edit':'create', id:id||'', draft:{}};
  if(type==='preset'){
    const p=editing?S.presets.find(x=>x.id===id):null;
    m.draft={name:p?p.name:'', note:p?p.note:'', codes:p?p.codes.join(' '):''};
  } else if(type==='model'){
    const mo=editing?S.models.find(x=>x.id===id):null;
    m.draft={id:mo?mo.id:'', name:mo?mo.name:''};
  } else if(type==='dataset'){
    const d=editing?S.datasets.find(x=>x.id===id):null;
    m.draft={name:d?d.name:'', model:d?d.model:((S.models[0]||{}).id||'')};
  } else if(type==='legal'){
    m.draft={reason:'', scope:'', n:0};
  }
  S.modal=m; render();
}
function closeModal(){ S.modal=null; render(); }
function modalSet(k,v){ if(S.modal) S.modal.draft[k]=v; }
function renderModal(){
  const m=S.modal; if(!m) return '';
  const d=m.draft, editing=m.mode==='edit';
  const shell=(title,body)=>`<div style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:90"
      onclick="if(event.target===this)closeModal()">
    <div class="card" style="width:560px" onclick="event.stopPropagation()">
      <h3>${title}</h3>${body}
      <div class="sep"></div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn pri" onclick="saveModal()">保存</button></div>
    </div></div>`;
  if(m.type==='preset'){
    return shell(editing?('编辑配置单 '+m.id):'新建配置单', `
      <div class="kv" style="grid-template-columns:80px 1fr;gap:12px">

function saveModal(){
  const m=S.modal; if(!m) return;

    const codes=(d.codes||'').split(/[\s,，]+/).filter(Boolean);
    if(!d.name.trim()){ toast('请填写名称','warn'); return; }
    if(!codes.length){ toast('至少填写一个编码','warn'); return; }
    const unknown=codes.filter(c=>!S.products.some(p=>p.code===c));
    if(m.mode==='create'){
      S.presets.push({id:'CFG-'+String(S.presets.length+1).padStart(2,'0'), name:d.name.trim(),
        note:d.note||'—', codes, by:'you', at:'刚刚'});
      toast('配置单已创建'+(unknown.length?('（'+unknown.length+' 个编码不存在，加载时跳过）'):''),'ok');
    } else {
      const p=S.presets.find(x=>x.id===m.id); if(!p) return;
      p.name=d.name.trim(); p.note=d.note||'—'; p.codes=codes; p.by='you'; p.at='刚刚';
      toast('配置单已更新','ok');
    }
  } else if(m.type==='model'){
    const mo=S.models.find(x=>x.id===m.id); if(!mo) return;
    if(!d.name.trim()){ toast('名称不能为空','warn'); return; }
    mo.name=d.name.trim(); toast('模型已重命名','ok');
  } else if(m.type==='dataset'){
    if(!d.name.trim()){ toast('名称不能为空','warn'); return; }
    if(m.mode==='create'){
      S.datasets.push({id:'ds-'+Math.floor(1000+Math.random()*900), name:d.name.trim(),
        train:0, defect:0, frozen:false, fp:'—', model:d.model});
      toast('数据集已创建','ok');
    } else {
      const ds=S.datasets.find(x=>x.id===m.id); if(!ds) return;
      if(ds.frozen && d.model!==ds.model){ toast('冻结验收集不能换归属模型','warn'); return; }
      ds.name=d.name.trim(); if(!ds.frozen) ds.model=d.model;
      toast('数据集已更新','ok');
    }
  } else if(m.type==='legal'){
    if(!d.reason.trim()){ toast('请填写原因','warn'); return; }
    S.legalHolds.push({id:'LH-'+String(S.legalHolds.length+1).padStart(2,'0'),
      reason:d.reason, scope:d.scope||'—', n:d.n||0, by:'you', at:'刚刚'});
    toast('已新增法务锁定','ok');
  }
  closeModal();
}
function deleteEntity(type, id){
  if(type==='preset'){
    if(S.activePreset===id){ toast('该配置单已加载，请先加载其它配置单再删除','warn'); return; }
    if(!confirm('删除配置单 '+id+'？')) return;
    S.presets=S.presets.filter(x=>x.id!==id); toast('已删除 '+id,'warn');
  } else if(type==='model'){
    const n=boundCount(id);
    if(n>0){ toast('仍绑定 '+n+' 个编码，无法归档；请先解绑或改绑','warn'); return; }
    if(!confirm('归档模型 '+id+'？版本历史保留，但不再出现在列表。')) return;
    S.models=S.models.filter(x=>x.id!==id); toast('模型已归档','warn');
  } else if(type==='dataset'){
    const d=S.datasets.find(x=>x.id===id); if(!d) return;
    if(d.frozen){ toast('冻结验收集不可删除','warn'); return; }
    if(!confirm('删除数据集 '+id+'？')) return;
    S.datasets=S.datasets.filter(x=>x.id!==id); toast('数据集已删除','warn');
  } else if(type==='legal'){
    if(!confirm('解除锁定 '+id+'？解除后相关数据可能被清理。')) return;
    S.legalHolds=S.legalHolds.filter(x=>x.id!==id); toast('已解除锁定','warn');
  } else if(type==='job'){
    const j=S.queue.find(x=>x.id===id); if(!j) return;
    if(j.status!=='done'){ toast('只能删除已完成的任务记录','warn'); return; }
    S.queue=S.queue.filter(x=>x.id!==id); toast('任务记录已删除','warn');
  }
  render();
}

function loadPreset(id){
  const p=S.presets.find(x=>x.id===id); if(!p||S.loading) return;
  const ok=p.codes.map(c=>S.products.find(x=>x.code===c)).filter(Boolean);
  const mids=[...new Set(ok.map(x=>x.model))];
  if(!mids.length){ toast('配置单里没有有效产品编码','warn'); return; }
  if(mids.length*122 > 29264){ toast('容量不足：需要 '+(mids.length*122)+' MB > 可用 29 GB','warn'); return; }
  const need=mids.filter(mid=>S.products.filter(x=>x.model===mid).some(x=>x.state!=='ready'));
  need.forEach(mid=>S.products.filter(x=>x.model===mid).forEach(x=>{x.state='loading';}));
  S.loading={id, total:need.length, done:0, started:Date.now()};
  if(!need.length){ S.loading=null; finishLoad(id, 0, mids); return; }
  render(); toast('开始加载 '+need.length+' 个模型（并发 4）','warn');
  need.forEach((mid,i)=>setTimeout(()=>{
    const fail = mid==='M-WS-01';
    S.products.filter(x=>x.model===mid).forEach(x=>{ x.state=fail?'failed':'ready'; if(!fail) x.vram=122; });
    S.loading.done++;
    if(CUR==='workorder') render();
    if(S.loading.done>=S.loading.total){ const ms=Date.now()-S.loading.started; S.loading=null; finishLoad(id, ms, mids); }
  }, 600+i*420));
}
function finishLoad(id, ms, mids){
  const failed=mids.filter(mid=>S.products.filter(x=>x.model===mid).some(x=>x.state==='failed'));
  if(!failed.length) S.activePreset=id;
  S.loadLog=S.loadLog||[];
  S.loadLog.unshift({at:'刚刚', preset:id, by:S.role==='tech'?'zhang (技术)':'wang (操作)', n:mids.length, ms, ok:!failed.length});
  toast(failed.length? ('加载完成，但 '+failed.join('、')+' 失败') : (id+' 已加载（'+mids.length+' 个模型，'+ms+' ms），可以开工'),
        failed.length?'warn':'ok');
  if(CUR==='workorder') render();
}

function enqueueJob(){
  const mid=$('#trainModel')?.value || S.models[0].id;
  if(S.queue.some(j=>j.model===mid && j.status!=='done')){ toast(mid+' 已有任务在队列中（同一模型不允许重复排队）','warn'); return; }
  const id='job-'+Math.floor(122+Math.random()*60);
  S.queue.push({id, model:mid, ds:'ds-'+Math.floor(1000+Math.random()*99), status:'queued', progress:0});
  toast('已加入队列：'+id+' → '+mid,'ok'); render(); runNext();
}
function advance(job){
  const timer=setInterval(()=>{
    job.progress=Math.min(100, job.progress+Math.random()*12+5);
    if(CUR==='train') render();
    if(job.progress>=100){ clearInterval(timer); job.status='done'; S.busy=false; finish(job); }
  },420);
}
function finish(job){
  const m=modelOf(job.model);
  const num=parseInt((m.versions[0]?m.versions[0].v:'v0').replace('v',''))+1;
  m.versions.unshift({v:'v'+num, status:'candidate', recall:+(95+Math.random()*3).toFixed(1),
    overkill:+(3.5+Math.random()*1.2).toFixed(1), p95:40, ds:job.ds, at:'刚刚'});
  toast(job.id+' 完成 → '+job.model+' 产出候选 v'+num,'ok');
  if(CUR==='train') render();
  runNext();
}
function runNext(){
  if(S.busy) return;
  const job=S.queue.find(j=>j.status==='queued'); if(!job) return;
  S.busy=true; job.status='running'; if(CUR==='train') render(); advance(job);
}
function moveJob(idx, dir){
  const q=S.queue, j=q[idx]; if(!j||j.status!=='queued') return;
  const t=idx+dir; if(t<0||t>=q.length) return;
  q[idx]=q[t]; q[t]=j; render();
}
function cancelJob(id){
  const i=S.queue.findIndex(j=>j.id===id); if(i<0) return;
  if(S.queue[i].status!=='queued'){ toast('执行中的任务不能取消，只能中止','warn'); return; }
  S.queue.splice(i,1); toast(id+' 已取消','warn'); render();
}

  const s=S.archiveStats;
  if(s.pending<=0){ toast('没有待归档数据','ok'); return; }
  S.archiveBatches.unshift({id:'AR-'+Math.floor(1000+Math.random()*9000), range:'11-01 ~ 11-15',
    model:'M-BR-01', n:s.pending, gb:s.pendingGB, sha:'ok', at:'刚刚'});
  S.storage.archive.used=+(S.storage.archive.used+s.pendingGB).toFixed(1);
  S.storage.hot.used=+(S.storage.hot.used-s.pendingGB).toFixed(1);
  toast('归档完成：'+fmt(s.pending)+' 张 / '+s.pendingGB+' GB · 校验回读通过','ok');
  s.pending=0; s.pendingGB=0; render();
}
function previewCleanup(){
  S.cleanupPreview={n:S.archiveStats.deletable, gb:S.archiveStats.deletableGB, prot:S.archiveStats.protected};
  render(); toast('保护过滤后：可删 '+fmt(S.archiveStats.deletable)+' 张','warn');
}
function runCleanup(){
  const cp=S.cleanupPreview;
  if(!cp){ toast('请先点「预览清理」','warn'); return; }
  const answer=prompt('将永久删除 '+fmt(cp.n)+' 张原图（'+cp.gb+' GB）。\n受保护 '+cp.prot+' 张不会删除。\n\n确认请输入删除条数：');
  if(answer===null) return;
  if(String(answer).replace(/,/g,'').trim()!==String(cp.n)){ toast('输入不匹配，已取消','warn'); return; }
  S.storage.hot.used=+(S.storage.hot.used-cp.gb).toFixed(1);
  S.archiveStats.deletable=0; S.archiveStats.deletableGB=0; S.cleanupPreview=null;
  toast('已删除 '+fmt(cp.n)+' 张，跳过受保护 '+cp.prot+' 张，已写审计','ok'); render();
}
function setFilter(mid){ S.reviewFilter=mid; render(); }function reviewCurrent(){
  return S.pool.filter(p=>!p.verdict && (S.reviewFilter==='all'||p.model===S.reviewFilter))[0];
}
function review(v){
  const item=reviewCurrent(); if(!item) return;
  item.verdict = v===1?'OK':v===0?'NG':'跳过'; S.budget.used+=6;
  if(v!==-1){
    const st=S.reviewStats[item.model]=S.reviewStats[item.model]||{ok:0,ng:0};
    if(v===1) st.ok++; else st.ng++;
    toast((v===1?'已标 OK（过杀）':'已标 NG')+' → 并入 '+item.model+' 的'+(v===1?'训练集':'验收集'),'ok');
  }
  render();
}
document.addEventListener('keydown',e=>{
  if(CUR!=='review') return;
  if(e.key==='1'){e.preventDefault();review(1);}
  if(e.key==='2'){e.preventDefault();review(0);}
  if(e.key===' '){e.preventDefault();review(-1);}
});
const _hp=hashPage(); if(_hp) CUR=_hp;
render();
try{ window.addEventListener('hashchange',()=>{ const p=hashPage(); if(p && p!==CUR){ CUR=p; render(); } }); }catch(e){}
// 恢复页面加载时正在执行的任务（演示用）；截图模式 ?static=1 下不启动
(function resume(){
  try{ if(/[?&]static=1/.test(location.search)) return; }catch(e){ return; }
  const running=S.queue.find(j=>j.status==='running');
  if(running){ S.busy=true; advance(running); }
})();
</script>
